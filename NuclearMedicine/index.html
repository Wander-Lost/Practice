可放出","options":[["A","γ 射线"],["B","特征 X 射线"],["C","荧光"],["D","俄歇电子"],["E","内转换电子"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"原子核从激发态回到基态时释放γ射线。"},{"id":209,"kind":"choice","multi":false,"stem":"²⁴₁₀X → ²⁴₁₁X + γ 表示的是","options":[["A","α 衰变"],["B","β⁻ 衰变"],["C","电子俘获"],["D","γ 衰变"],["E","β⁺ 衰变"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"原子核从激发态跃迁至基态，释放γ射线，质量数和电荷数不变。"},{"id":210,"kind":"choice","multi":false,"stem":"关于 γ 射线下列正确的是","options":[["A","在所有的核衰变中均发射"],["B","每次 β 衰变时发射"],["C","当原子核处于激发态时发射"],["D","每次 α 衰变时发射"],["E","电子俘获时发射"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"γ射线是核从激发态退激时释放的，并非所有衰变都伴随。"},{"id":211,"kind":"choice","multi":false,"stem":"内转换电子产生于","options":[["A","α 衰变"],["B","光电效应"],["C","康普顿效应"],["D","γ 衰变"],["E","湮灭辐射"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"内转换电子是原子核激发态的能量直接传递给轨道电子，使其发射，属于γ衰变的竞争过程。"},{"id":212,"kind":"choice","multi":false,"stem":"处于激发态的原子核把跃迁能量传递给本原子的一个电子，使其脱离原子轨道，由此产生的自由电子的名称是","options":[["A","β⁻ 粒子"],["B","β⁺ 粒子"],["C","光电子"],["D","α 粒子"],["E","内转换电子"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"内转换电子是由核激发能量直接转移给轨道电子而产生的。"},{"id":213,"kind":"choice","multi":false,"stem":"原子核发生电子俘获后","options":[["A","质子数减少 2，质量数减少 4，放出 α 射线"],["B","质子数增加 1，质量数不变，放出 β⁻ 射线"],["C","质子数减少 1，质量数不变，放出 β⁺ 射线"],["D","质子数减少 1，质量数不变，释放出特征 X 射线和俄歇电子"],["E","质子数和质量数都不变，放出 γ 射线"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"电子俘获使质子数减1，质量数不变，伴随特征X射线和俄歇电子。"},{"id":214,"kind":"choice","multi":false,"stem":"关于电子俘获下列正确的是","options":[["A","可能伴随特征 X 射线和俄歇电子发射"],["B","不伴随 γ 射线产生"],["C","释放高能量电子"],["D","释放中子"],["E","释放正电子"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"电子俘获后内层空穴被填充，产生特征X射线和俄歇电子。"},{"id":215,"kind":"choice","multi":false,"stem":"发生电子俘获后，原子的内层轨道缺少了电子，外层轨道电子填充到内层轨道上，由于外层电子比内层电子的能量大，多余的能量传递给更外层的轨道电子，使之脱离轨道而释出，此电子称为","options":[["A","正电子"],["B","光电子"],["C","康普顿电子"],["D","内转换电子"],["E","俄歇电子"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"俄歇电子是原子内层空穴被填充时，能量转移给另一轨道电子使其发射。"},{"id":216,"kind":"choice","multi":false,"stem":"α 衰变和 β 衰变的共同点是","options":[["A","均发生于较重的原子核"],["B","均发生于富中子原子核"],["C","均受环境温度影响"],["D","均放出具有单一能量的粒子"],["E","均遵循核衰变定律"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"所有放射性衰变都遵循指数衰变定律。"},{"id":217,"kind":"choice","multi":false,"stem":"放射性衰变的指数规律描述的是","options":[["A","活度随着能量变化"],["B","能量随着时间变化"],["C","电离能力随着速度变化"],["D","射程随着密度变化"],["E","活度随着时间变化"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"放射性活度随时间呈指数衰减。"},{"id":218,"kind":"choice","multi":false,"stem":"关于放射性衰变的指数规律，正确的表达式是","options":[["A","N = N₀ e⁻λᵗ"],["B","N = N₀ eλᵗ"],["C","N = N₀ e⁻²λᵗ"],["D","N₀ = N e⁻λᵗ"],["E","N₀ = N e²λᵗ"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"正确的指数衰变公式为 N = N₀ e⁻λᵗ，但原答案给定C（可能笔误），按原数据保留。"},{"id":219,"kind":"choice","multi":false,"stem":"在半对数坐标上描绘核素的衰变将产生一条直线，其斜率取决于核素的","options":[["A","能量"],["B","数量"],["C","放射性活度"],["D","半衰期"],["E","衰变方式"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":"","explanation":"半对数坐标下衰变曲线斜率为 -λ，与半衰期相关。"},{"id":220,"kind":"choice","multi":false,"stem":"关于放射性核素半衰期的描述，错误的是","options":[["A","半衰期是指放射性核素原子数减少一半的时间"],["B","半衰期不受温度影响"],["C","排泄快的放射性药物中的放射性核素半衰期短"],["D","同一核素的半衰期在体内与体外是相同的"],["E","半衰期与衰变常数成反比"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"1. 核医学物理基础","topic3":"","diff":"","level":""," 辐射。"},{"id":803,"kind":"choice","multi":false,"stem":"关于辐射剂量单位，错误的是","options":[["A","照射量反映的是射线空间分布的辐射剂量"],["B","照射量与放射源的活度及位置有关"],["C","吸收剂量为单位质量的受照物质吸收射线的平均能量"],["D","待积当量剂量和待积有效剂量是用于评价人体的外照射剂量"],["E","当量剂量是衡量射线生物效应及危险度的辐射单位"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"待积剂量用于评价内照射（摄入放射性物质后的累积剂量），非外照射。"},{"id":804,"kind":"choice","multi":false,"stem":"关于确定性效应，错误的是","options":[["A","不存在具体的剂量阈值"],["B","辐射效应的严重程度与所受的剂量呈正相关"],["C","主要表现形式有白内障、再生障碍性贫血、不育"],["D","一般指短期内受较大剂量照射时发生的急性损害"],["E","依据组织敏感性的不同，不同的组织有着不同的阈值"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"确定性效应具有剂量阈值，低于阈值不发生。"},{"id":805,"kind":"choice","multi":false,"stem":"关于随机性效应，错误的是","options":[["A","不存在剂量阈值"],["B","辐射效应发生的概率与剂量相关"],["C","严重程度与剂量有关"],["D","主要表现形式为致畸和致癌"],["E","研究的对象是群体"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"随机性效应的严重程度与剂量无关，只影响发生概率。"},{"id":806,"kind":"choice","multi":false,"stem":"关于放射防护的目的，错误的是","options":[["A","防止确定性效应的发生"],["B","限制随机效应的诱发"],["C","使辐射效应达到合理、可以接受的水平"],["D","尽量保证不受到照射"],["E","防止受照剂量超过确定性效应的阈值"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"防护目的是将剂量限制在阈值以下并优化，而非完全不照射（不现实）。"},{"id":807,"kind":"choice","multi":false,"stem":"放射防护的基本原则为：","options":[["A","减少接触放射源的时间、增大与放射源的距离及使用屏蔽"],["B","放射实践的正当化、放射防护最优化及个人剂量限制"],["C","防止放射性物质经呼吸道、消化道及皮肤进入体内"],["D","任何时候均穿戴铅衣"],["E","如果放射诊疗是正当的，就不必进行防护"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"防护三原则：正当化、最优化、个人剂量限值。"},{"id":808,"kind":"choice","multi":false,"stem":"核医学中外照射防护的基本原则","options":[["A","操作放射性物质后，洗手和进行表面污染检测"],["B","减少接触放射源的时间、增大与放射源的距离、使用屏蔽"],["C","防止放射性物质经呼吸道、消化道及皮肤进入体内"],["D","戴手套及口罩"],["E","在附有吸水纸的托盘中操作放射性物质"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"外照射防护三要素：时间、距离、屏蔽。"},{"id":809,"kind":"choice","multi":false,"stem":"关于内照射防护原则，正确的是","options":[["A","减少接触放射源的时间"],["B","增大与放射源的距离"],["C","尽可能防止放射性物质进入体内"],["D","设置防护屏蔽"],["E","佩戴个人剂量计"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"内照射防护核心是阻止放射性物质进入体内（如密封、通风、个人防护）。"},{"id":810,"kind":"choice","multi":false,"stem":"γ射线外照射防护材料采用","options":[["A","原子序数较低的材料"],["B","原子序数较高的材料"],["C","有机玻璃"],["D","口罩和乳胶手套"],["E","塑料安全护目镜"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"γ射线需高原子序数材料（如铅、钨）进行屏蔽。"},{"id":811,"kind":"choice","multi":false,"stem":"我国现行标准规定了公众的个人剂量限值，其年有效剂量不应超过","options":[["A","1mSv"],["B","10mSv"],["C","15mSv"],["D","20mSv"],["E","50mSv"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"公众年有效剂量限值为 1 mSv（特殊情况下可提高到 5 mSv）。"},{"id":812,"kind":"choice","multi":false,"stem":"我国现行标准规定的职业照射个人剂量限值，连续5年的平均有效剂量不应超过","options":[["A","1mSv"],["B","15mSv"],["C","20mSv"],["D","50mSv"],["E","150mSv"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"职业照射连续5年平均有效剂量 ≤ 20 mSv（任意单年 ≤ 50 mSv）。"},{"id":813,"kind":"choice","multi":false,"stem":"关于核医学工作场所的放射防护要求，错误的是","options":[["A","核医学工作场所布局应合理，应分区设置空间"],["B","分装放射性药物应在通风橱中进行"],["C","应设立放射性污水池"],["D","工作人员与患者共用出入口"],["E","核素显像的受检者应有专用厕所"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"工作人员与患者应分区、分通道，避免交叉污染。"},{"id":814,"kind":"choice","multi":false,"stem":"关于放射性药物操作的防护要求，错误的是","options":[["A","放射性药物操作应在铺有吸水纸的托盘中进行"],["B","工作人员操作放射性药物应戴手套"],["C","操作放射性碘化物类药物应在活性室的注射台面操作"],["D","放射性药物的到货、使用和储存应及时登记、建档"],["E","工作人员离开放射性工作室应洗手和进行污染监测"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"8. 辐射防护","topic3":"","diff":"","level":"","explanation":"操作放射性碘化物（挥发性）应在通风橱中进行，而非普通注射台面。"},{"id":901,"kind":"choice","multi":false,"stem":"目前在肿瘤核医学方面临床应用最广泛的仪器是","options":[["A","γ照相机"],["B","SPECT"],["C","SPECT/CT"],["D","PET/MR"],["E","PET/CT"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"PET/CT 融合功能与解剖信息，是目前肿瘤显像最广泛应用的设备。"},{"id":902,"kind":"choice","multi":false,"stem":"目前临床应用最广泛、被誉为\"世纪分子\"的肿瘤显像剂是","options":[["A","¹⁸F-FDG"],["B","⁹⁹ᵐTc-MDP"],["C","¹¹C-MET"],["D","⁹⁹ᵐTc-MIBI"],["E","¹⁸F-FET"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"¹⁸F-FDG 是葡萄糖类似物，被誉为\"世纪分子\"，应用最广。"},{"id":903,"kind":"choice","multi":false,"stem":"下列说法不正确的是","options":[["A","¹⁸F-FDG 反映葡萄糖的代谢状况"],["B","¹⁸F-FDG 能够在己糖激酶作用下转化为 6-磷酸-¹⁸FDG"],["C","¹⁸F-FDG 的吸收与血糖水平无关"],["D","¹⁸F-FDG 也能被炎症病灶吸收"],["E","¹⁸F-FDG 摄取多少与肿瘤细胞表面的葡萄糖转运体多少相关"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"FDG 吸收与血糖水平竞争性抑制，血糖升高会降低肿瘤摄取。"},{"id":904,"kind":"choice","multi":false,"stem":"关于 ¹⁸F-FDG PET 显像，做法不对的是","options":[["A","注射前后患者处于安静状态"],["B","显像前排空尿液有利于腹部显像"],["C","检查前，如血糖低于正常，可适量补充葡萄糖"],["D","空腹血糖升高者，可使用胰岛素控制血糖"],["E","禁食 6 小时以上，检查前要大量饮水，充分水化"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"检查前应禁食，不可补充葡萄糖，以免竞争抑制肿瘤摄取。"},{"id":905,"kind":"choice","multi":false,"stem":"下列哪项与肿瘤组织摄取 ¹⁸F-FDG 的高低程度关系不大","options":[["A","肿瘤的组织类型"],["B","肿瘤细胞的分化程度"],["C","肿瘤组织中肿瘤细胞的负荷"],["D","肿瘤细胞的增殖情况"],["E","肿瘤的生长方式"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"FDG 摄取与肿瘤代谢活性相关，生长方式（如膨胀性、浸润性）影响不大。"},{"id":906,"kind":"choice","multi":false,"stem":"关于肿瘤细胞的葡萄糖代谢特点描述错误的是","options":[["A","糖酵解增强"],["B","糖分解增强"],["C","细胞表面葡萄糖转运体 1 和 3 高表达"],["D","细胞内己糖激酶高表达"],["E","磷酸化酶大多数情况高表达"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"肿瘤细胞中己糖激酶高表达，而非磷酸化酶（磷酸化酶与糖原分解相关）。"},{"id":907,"kind":"choice","multi":false,"stem":"正常生理情况下，下列器官中摄取 FDG 最少的是","options":[["A","脑"],["B","心肌"],["C","肝脏"],["D","肺"],["E","肠道"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"肺组织生理性FDG摄取较低，因肺泡细胞葡萄糖代谢率低。"},{"id":908,"kind":"choice","multi":false,"stem":"下列肿瘤组织中对 ¹⁸F-FDG 摄取一般较低的是","options":[["A","B 细胞淋巴瘤"],["B","结肠低分化腺癌"],["C","胃印戒细胞癌"],["D","乳腺浸润性导管癌"],["E","低分化肝细胞癌"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"胃印戒细胞癌多为低代谢，FDG摄取常较低。"},{"id":909,"kind":"choice","multi":false,"stem":"下列常用于诊断脑胶质瘤术后残留的显像剂是","options":[["A","¹⁸F-FDG"],["B","¹¹C-MET"],["C","¹¹C-Acetate"],["D","⁹⁹ᵐTc-MDP"],["E","¹⁸F-MISO"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"¹¹C-MET（蛋氨酸）对脑胶质瘤术后残留的检测优于FDG（脑本底高）。"},{"id":910,"kind":"choice","multi":false,"stem":"下列哪项不是肺癌阳性显像","options":[["A","⁶⁷Ga SPECT/CT 显像"],["B","²⁰¹Tl SPECT/CT 显像"],["C","⁹⁹ᵐTc-MIBI SPECT/CT 显像"],["D","¹⁸F-FDG PET/CT 显像"],["E","⁹⁹ᵐTc-MAA SPECT/CT 显像"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-MAA 用于肺灌注显像，反映血流分布，非肿瘤阳性显像。"},{"id":911,"kind":"choice","multi":false,"stem":"高分化肝细胞肝癌 ¹⁸F-FDG 摄取较低，原因是","options":[["A","细胞膜葡萄糖转运体表达较少"],["B","肝癌细胞内葡萄糖激酶含量低"],["C","肝癌细胞内磷酸化酶高表达"],["D","肝癌细胞增殖较慢"],["E","肝癌病灶血供差"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"高分化肝癌细胞中葡萄糖-6-磷酸酶活性高，使FDG-6-磷酸去磷酸化，从而摄取低。"},{"id":912,"kind":"choice","multi":false,"stem":"下列哪类肿瘤摄取 ¹⁸F-FDG 较低","options":[["A","乳腺浸润性导管癌"],["B","胰腺导管上皮癌"],["C","食管鳞状细胞癌"],["D","肾透明细胞癌"],["E","恶性黑色素瘤"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"肾透明细胞癌因葡萄糖转运体表达低及高糖原含量，FDG摄取常较低。"},{"id":913,"kind":"choice","multi":false,"stem":"晚期恶性黑色素瘤患者为明确有无转移，首选","options":[["A","MR"],["B","¹⁸F-FES PET/CT"],["C","¹⁸F-FDG PET/CT"],["D","⁹⁹ᵐTc-MDP SPECT/CT"],["E","⁹⁹ᵐTc-MIBI SPECT/CT"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"¹⁸F-FDG PET/CT 对黑色素瘤转移灶检出灵敏度高，为首选。"},{"id":914,"kind":"choice","multi":false,"stem":"下列哪种显像药可以指导前列腺癌核素内照射治疗","options":[["A","¹⁸F-FDG"],["B","¹¹C-MET"],["C","¹¹C-CHO"],["D","¹⁸F-FES"],["E","⁶⁸Ga-PSMA"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"⁶⁸Ga-PSMA 可靶向前列腺特异性膜抗原，用于筛选177Lu-PSMA治疗患者。"},{"id":915,"kind":"choice","multi":false,"stem":"下列一般不能作为肿瘤单光子显像剂的是","options":[["A","⁹⁹ᵐTc-MIBI"],["B","⁹⁹ᵐTc-DMSA(V)"],["C","⁶⁷Ga(枸橼酸)"],["D","⁹⁹ᵐTc-DTPA"],["E","⁹⁹ᵐTc-tetrofosmin"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-DTPA 用于肾动态显像，非肿瘤显像剂。"},{"id":916,"kind":"choice","multi":false,"stem":"下列说法错误的是","options":[["A","放疗和化疗可以降低肿瘤对 ¹⁸F-FDG 的摄取"],["B","胸腺可以有 ¹⁸F-FDG 生理性摄取，特别是在年轻人"],["C","炎性肉芽组织不摄取 ¹⁸F-FDG"],["D","外伤或手术伤口对 ¹⁸F-FDG 的摄取可长达 6 个月"],["E","化疗后 1~3 周可见骨髓组织摄取 ¹⁸F-FDG"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"炎性肉芽组织（如结核、肉芽肿）也可摄取FDG，导致假阳性。"},{"id":917,"kind":"choice","multi":false,"stem":"下列哪项不是淋巴瘤患者行 ¹⁸F-FDG PET/CT 检查目的","options":[["A","指导分期"],["B","评价疗效"],["C","判断预后"],["D","鉴别诊断"],["E","指导靶向治疗"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"FDG PET/CT 用于分期、疗效评估和预后判断，靶向治疗需特定靶点药物指导。"},{"id":918,"kind":"choice","multi":false,"stem":"乳腺癌患者怀疑骨转移，不能作为诊断骨转移方法的是","options":[["A","¹⁸F-FDG PET/CT"],["B","⁹⁹ᵐTc-MDP-SPECT/CT"],["C","¹⁸F-RGD PET/CT"],["D","⁹⁹ᵐTc-MIBI-SPECT/CT"],["E","Na¹⁸F PET/CT"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"9. 肿瘤显像","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-MIBI 主要用于心肌或肿瘤显像，对骨转移不敏感，不作为骨转移诊断方法。"},{"id":1001,"kind":"choice","multi":false,"stem":"²⁰¹₈₁Tl 再分布是下列哪种疾病的特征性表现","options":[["A","急性心肌梗死"],["B","陈旧性心肌梗死"],["C","心肌缺血"],["D","心肌炎"],["E","心肌病"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"²⁰¹Tl 再分布现象是心肌缺血的特征，缺血区初始摄取减少，延迟后缓慢填充。"},{"id":1002,"kind":"choice","multi":false,"stem":"目前公认的检测存活心肌的常规检查方法是","options":[["A","门电路心血池断层显像"],["B","64 排螺旋 CT"],["C","心肌灌注显像联合 ¹⁸F-FDG 心肌代谢 PET 显像"],["D","SPECT 心肌灌注显像"],["E","超声心动图"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"灌注-代谢匹配是评估心肌存活的“金标准”，灌注缺损但代谢正常提示存活。"},{"id":1003,"kind":"choice","multi":false,"stem":"心肌摄取显像剂的最主要与下列哪项因素有关","options":[["A","心肌厚度"],["B","缺血病灶的大小"],["C","冠脉血流量"],["D","心肌弥散性清除率"],["E","患者的体重"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"心肌摄取显像剂（如 ²⁰¹Tl、⁹⁹ᵐTc-MIBI）与局部心肌血流量成正比。"},{"id":1004,"kind":"choice","multi":false,"stem":"下列门控心血池显像测定中，最常用的反映心脏舒张功能的参数是","options":[["A","PER"],["B","PFR"],["C","LVEF"],["D","TPER"],["E","RWM"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"PFR（峰值充盈率）反映舒张早期充盈速度，是舒张功能常用指标。"},{"id":1005,"kind":"choice","multi":false,"stem":"心肌灌注显像常用的显像剂是","options":[["A","⁹⁹ᵐTc-RBC"],["B","⁹⁹ᵐTc-ECD"],["C","⁹⁹ᵐTc-MIBI"],["D","⁹⁹ᵐTc-EHIDA"],["E","⁹⁹ᵐTc-PYP"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-MIBI（甲氧异腈）是临床上最常用的心肌灌注显像剂。"},{"id":1006,"kind":"choice","multi":false,"stem":"关于 PFR 准确的含义是","options":[["A","高峰充盈率"],["B","收缩功能参数"],["C","射血分数"],["D","高峰收缩率"],["E","局部舒张功能参数"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"PFR 全称为 Peak Filling Rate，即高峰充盈率。"},{"id":1007,"kind":"choice","multi":false,"stem":"心肌缺血时，心肌灌注 SPECT 显像表现为","options":[["A","固定性放射性缺损"],["B","放射性持续缺损"],["C","放射性分布增强"],["D","放射性分布无变化"],["E","可逆性放射性缺损"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic ","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc 标记药物可注射大剂量，图像质量好，此说法错误。"},{"id":1040,"kind":"choice","multi":false,"stem":"以下哪项不是 PET 核素正电子心肌灌注显像剂具有的特点","options":[["A","半衰期很短，可在短时间内重复注射检查"],["B","与 SPECT 相比，PET 具有更高的空间分辨率和探测效率"],["C","可对心肌血流进行绝对定量"],["D","不能计算心肌血流储备（MFR）"],["E","使用正电子核素心肌灌注显像需要配备生产核素的加速器或发生器"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"PET 可计算 MFR（血流储备），此说法错误。"},{"id":1041,"kind":"choice","multi":false,"stem":"心肌灌注显像呈“花斑型”灌注缺损，提示","options":[["A","心肌病和心肌炎"],["B","心肌梗死伴心肌缺血"],["C","不典型心肌缺血"],["D","侧支循环形成"],["E","轻度的陈旧性心肌梗死"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"花斑状稀疏多见于心肌病或心肌炎。"},{"id":1042,"kind":"choice","multi":false,"stem":"分析心肌断层图像应注意的组织衰减有","options":[["A","肝影干扰，导致下壁放射性稀疏"],["B","心脏影像干扰，导致前壁放射性稀疏"],["C","胸壁肌肉对左室前壁的影响可致前壁稀疏"],["D","肺影干扰，导致前壁放射性稀疏"],["E","膈肌对下壁影响，可引起下后壁放射性稀疏"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"膈肌衰减常见于下壁，可致伪影。"},{"id":1043,"kind":"choice","multi":false,"stem":"心肌代谢显像的临床价值是","options":[["A","鉴别心脏瓣膜病"],["B","早期诊断心肌缺血"],["C","明确诊断急性心肌炎"],["D","检测存活心肌"],["E","鉴别心肌病类型"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"代谢显像（FDG PET）主要用于存活心肌检测。"},{"id":1044,"kind":"choice","multi":false,"stem":"关于核素心肌灌注显像的临床价值，以下不正确的是","options":[["A","较高的灵敏度"],["B","特异性和准确性较高"],["C","明确病灶的部位、范围和程度"],["D","准确判断预后"],["E","它直接反映了病变冠脉血流灌注状态"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"心肌灌注显像可评估预后，但“准确判断”过于绝对，需结合临床。"},{"id":1045,"kind":"choice","multi":false,"stem":"以下哪项不属于核素负荷及静息心肌显像不能准确检出冠心病心肌缺血的主要原因","options":[["A","运动量不足"],["B","冠状动脉狭窄程度轻"],["C","冠状动脉近端的狭窄"],["D","冠状动脉狭窄后侧支循环形成以及多支病变"],["E","狭窄程度相似"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"近端狭窄通常能被检出，不是漏诊的主要原因。"},{"id":1046,"kind":"choice","multi":false,"stem":"以下哪项不是 ¹⁸F-FDG 心肌代谢 PET 显像的临床价值","options":[["A","冠心病的早期诊断"],["B","左心室泵功能情况"],["C","心肌缺血范围与程度的客观评价及心肌梗死区存活心肌的准确判断"],["D","冠状动脉血管重建术前适应证选择"],["E","心肌病异常代谢的研究与病因探讨"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"10. 心血管系统","topic3":"","diff":"","level":"","explanation":"左心室泵功能评估通常由心血池显像或超声完成，并非 FDG PET 的主要价值。"},{"id":1101,"kind":"choice","multi":false,"stem":"以下哪种不是脑血流灌注显像的显像剂","options":[["A","⁹⁹ᵐTc-HMPAO"],["B","⁹⁹ᵐTc-ECD"],["C","¹²³I-IMP"],["D","¹⁸F-FDG"],["E","¹³³Xe"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"¹⁸F-FDG 为葡萄糖代谢显像剂，不用于脑血流灌注显像。"},{"id":1102,"kind":"choice","multi":false,"stem":"脑梗死在脑血流灌注显像上，何时能显示异常影像","options":[["A","发病即刻"],["B","发病 6 小时后"],["C","发病 1 天后"],["D","发病 2～3 天后"],["E","发病一周后"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑血流灌注显像在脑梗死发病即刻即可显示低灌注区。"},{"id":1103,"kind":"choice","multi":false,"stem":"以下哪项不是理想的脑血流灌注显像剂应具备的特性","options":[["A","具有穿透血脑屏障的能力"],["B","在脑中滞留足够的时间"],["C","具有确定的脑区域分布"],["D","在脑组织中清除快"],["E","经血-脑脊液屏障进入脑细胞后，转变为极性化合物，不能再扩散回血液中"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"理想显像剂应在脑内滞留足够长的时间，清除快不利于显像。"},{"id":1104,"kind":"choice","multi":false,"stem":"短暂性脑缺血发作（TIA）脑血流灌注显像典型表现为","options":[["A","局限性异常放射性增高影"],["B","脑萎缩征"],["C","交叉性小脑失联络现象"],["D","局限性异常放射性减低"],["E","双侧顶叶和颞叶放射性明显减低"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"TIA 发作时缺血区血流减低，显示为局限性稀疏/缺损。"},{"id":1105,"kind":"choice","multi":false,"stem":"有关 SPECT 脑血流灌注显像诊断 TIA，以下说法错误的是","options":[["A","可以灵敏的检出 TIA 缺血病灶"],["B","影像常表现为相应部位的放射性稀疏或缺损区，可单个或多个"],["C","发病后尽早检查可提高诊断阳性率"],["D","发病后 2 周检查阳性率最高"],["E","为提高诊断灵敏度，可使用介入试验"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"TIA 阳性率在发病后早期（24小时内）最高，2周后多转为正常。"},{"id":1106,"kind":"choice","multi":false,"stem":"脑血流灌注显像中异常影像的读片要点以下哪项正确","options":[["A","某一断面同一部位一个以上层面异常表现，并在其他断面的相应层面上有相应表现"],["B","某一断面同一部位连续两个以上层面异常表现，并在其他断面的相应层面上有相应表现"],["C","某一断面同一部位连续三个以上层面异常表现，并在其他断面的相应层面上有相应表现"],["D","只要某一断面的某个层面有异常表现即可诊断"],["E","某一断面连续三个以上层面有异常表现即可诊断"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"需连续两个以上层面且与其他断面相应位置一致，减少伪影干扰。"},{"id":1107,"kind":"choice","multi":false,"stem":"关于脑血流灌注显像介入试验，错误的是","options":[["A","可以通过生理性刺激或药物（如某些血管扩张剂）来完成"],["B","药物负荷试验可应用乙酰唑胺、双嘧达莫、腺苷等药物介入试验，提高该病的阳性检出率"],["C","有助于隐匿性脑缺血灶和小梗死灶的诊断"],["D","不能有效提高短暂性脑缺血发作（TIA）诊断的阳性率"],["E","有助于脑血管疾病治疗效果和预后的预测"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"介入试验可明显提高 TIA 诊断阳性率，此说法错误。"},{"id":1108,"kind":"choice","multi":false,"stem":"采用脑血流灌注显像，在癫痫病灶部位的阳性发现是","options":[["A","发作期和发作间期均见局部放射性增高"],["B","发作期和发作间期均见局部放射性减低"],["C","发作期局部放射性增高，发作间期放射性减低"],["D","发作期局部放射性减低，发作间期放射性增高"],["E","发作期与发作间期整个脑皮层放射性均增高"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"癫痫发作期局部血流增加（放射性增高），发作间期血流减少（放射性减低）。"},{"id":1109,"kind":"choice","multi":false,"stem":"常用的脑血流灌注显像显像剂是一种","options":[["A","水溶性、电中性的物质"],["B","脂溶性、电中性的物质"],["C","脂溶性、高分子的物质"],["D","水溶性、高分子的物质"],["E","脂溶性、负电荷的物质"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑血流灌注显像剂多为脂溶性、电中性，易于通过血脑屏障。"},{"id":1110,"kind":"choice","multi":false,"stem":"进行脑血流灌注显像，以下哪项检查前准备有误","options":[["A","口服过氯酸钾以封闭脉络丛、甲状腺和鼻黏膜"],["B","使OM线垂直于地面"],["C","保持室内光线充足"],["D","戴眼罩，塞耳塞"],["E","光照暗液，保持安静"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑血流显像应保持环境安静、光线较暗，减少视觉听觉刺激对脑血流的影响。"},{"id":1111,"kind":"choice","multi":false,"stem":"Parkinson病脑血流灌注显像的特征性 灌注呈放射性异常浓聚"],["C","多巴胺神经受体显像可用于 PD 和 PD 综合征的诊断和鉴别诊断"],["D","脑代谢显像可用于鉴别诊断脑肿瘤术后或放疗后是否复发或坏死"],["E","脑代谢研究能反映人脑的生理功能和病理状态"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"癫痫发作间期应为放射性减低，发作期为增高，并非均为浓聚。"},{"id":1117,"kind":"choice","multi":false,"stem":"要研究大脑功能与代谢的关系，应当选用下列哪项最佳组合","options":[["A","³H 标记的葡萄糖，PET 显像"],["B","¹⁸F 标记的葡萄糖，SPECT 显像"],["C","⁹⁹ᵐTc 标记的葡萄糖，双探头 SPECT 显像"],["D","¹⁸F 标记的脱氧葡萄糖，PET 显像"],["E","⁹⁹ᵐTc 标记的葡萄糖，PET 显像"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"¹⁸F-FDG PET 是研究脑葡萄糖代谢的标准方法。"},{"id":1118,"kind":"choice","multi":false,"stem":"转移性脑肿瘤脑血流灌注显像与脑代谢显像各自常表现为","options":[["A","脑血流灌注显像常为相对低灌注，可显示放射性缺损、稀疏；¹⁸F-FDG 和 ¹¹C-蛋氨酸代谢显像为异常浓聚"],["B","脑血流灌注显像常为相对高灌注，可显示放射性增高；¹⁸F-FDG 和 ¹¹C-蛋氨酸代谢显像为异常浓聚"],["C","脑血流灌注显像常为相对高灌注，可显示放射性增高；¹⁸F-FDG 和 ¹¹C-蛋氨酸代谢显像为降低"],["D","脑血流灌注显像常为相对低灌注，可显示放射性缺损、稀疏；¹⁸F-FDG 和 ¹¹C-蛋氨酸代谢显像为降低"],["E","脑血流灌注显像常为相对低灌注，可显示放射性缺损、稀疏；¹⁸F-FDG 和 ¹¹C-蛋氨酸代谢显像无异常浓聚"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"转移瘤血流灌注减低，但代谢活跃，FDG和蛋氨酸显像呈高摄取。"},{"id":1119,"kind":"choice","multi":false,"stem":"⁹⁹ᵐTc-HMPAO 的摄取机制与下列哪项有关","options":[["A","血脑屏障的破坏"],["B","局部脑葡萄糖代谢"],["C","局部脑血流量"],["D","神经受体分布"],["E","脑缺血程度"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"HMPAO 为脂溶性，通过血脑屏障后转化为亲水性，其首次通过摄取与血流量成正比。"},{"id":1120,"kind":"choice","multi":false,"stem":"以下哪种显像剂可通过完整的血脑屏障","options":[["A","⁹⁹ᵐTc-DTPA"],["B","⁹⁹ᵐTcO₄⁻"],["C","⁹⁹ᵐTc-GH"],["D","⁹⁹ᵐTc-HMPAO"],["E","⁹⁹ᵐTc-MIBI"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"HMPAO 和 ECD 等脑血流灌注显像剂能通过完整的血脑屏障。"},{"id":1121,"kind":"choice","multi":false,"stem":"采用不通过血脑屏障的静态显像中脑瘤阳性率与下列哪项有关","options":[["A","与病灶大小有关，与部位及病理性质无关"],["B","与部位有关，与病理性质及大小无关"],["C","与病理性质、部位、大小均有关"],["D","与病理性质、部位、大小均无关"],["E","与病理性质有关，与部位及大小无关"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑静态显像阳性取决于血脑屏障破坏程度，与肿瘤性质、位置和大小无关。"},{"id":1122,"kind":"choice","multi":false,"stem":"采用不通过血脑屏障显像剂脑静态显像中脑梗死阳性发现多见于起病后","options":[["A","第一天内"],["B","第一周内"],["C","第二至四周内"],["D","第五周内"],["E","第六周后"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑梗死区血脑屏障破坏在2~4周最明显，阳性率最高。"},{"id":1123,"kind":"choice","multi":false,"stem":"诊断短暂性脑出血发作（TIA）最好的方法是","options":[["A","脑室显像"],["B","脑池显像"],["C","脑血管显像"],["D","脑静态显像"],["E","脑血流灌注显像"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑血流灌注显像可灵敏检出TIA所致的血流减低区。"},{"id":1124,"kind":"choice","multi":false,"stem":"脑脊液间隙显像中，常用的显像剂是","options":[["A","⁹⁹ᵐTc-ECD"],["B","⁹⁹ᵐTc-DTPA"],["C","⁹⁹ᵐTc-HMPAO"],["D","¹³N-NH₃H₂O"],["E","¹⁵O-H₂O"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-DTPA 用于脑脊液间隙显像（如脑池、脑室显像）。"},{"id":1125,"kind":"choice","multi":false,"stem":"脑血流灌注显像药物负荷试验中，目前在临床上最常用下列哪种药物","options":[["A","腺苷"],["B","双嘧达莫"],["C","过氧酸铜"],["D","卡托普利"],["E","乙酰唑胺"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"乙酰唑胺（Diamox）是脑血流负荷试验最常用的药物。"},{"id":1126,"kind":"choice","multi":false,"stem":"脑血流灌注显像诊断脑死亡的特征性影像表现是","options":[["A","两大脑半球多发性放射性摄取减低区"],["B","两大脑半球无放射性"],["C","两大脑半球放射性摄取减低"],["D","上矢状窦持续不显影"],["E","双侧额顶叶灌注减低"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑死亡时脑血流完全停止，显像可见“空颅”征。"},{"id":1127,"kind":"choice","multi":false,"stem":"脑断层显像所用的 OM 线是指","options":[["A","外眦-外耳道连线"],["B","外眦-小脑连线"],["C","颞-小脑连线"],["D","外眦-顶骨连线"],["E","外眦-枕骨连线"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"OM 线即眶耳线（Orbitomeatal line），用于脑断层定位。"},{"id":1128,"kind":"choice","multi":false,"stem":"交通性脑积水最好选用","options":[["A","增强 MRI"],["B","增强 CT"],["C","脑脊液间隙显像"],["D","脑血流灌注显像"],["E","脑血管动态显像"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑脊液间隙显像（脑池显像）可评估脑脊液循环，诊断交通性脑积水。"},{"id":1129,"kind":"choice","multi":false,"stem":"脑组织需要消耗大量的能量，正常情况下几乎是其唯一能量的是","options":[["A","脂肪酸"],["B","氨基酸"],["C","葡萄糖"],["D","乳酸"],["E","蛋白质"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑细胞几乎唯一依赖葡萄糖供能。"},{"id":1130,"kind":"choice","multi":false,"stem":"诊断脑脊液鼻漏或耳漏最有效的方法是","options":[["A","放射性核素脑血管显像"],["B","脑静态显像"],["C","脑血流灌注显像"],["D","脑池显像"],["E","脑室显像"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"脑池显像可追踪脑脊液漏出部位，是诊断脑脊液漏的金标准。"},{"id":1131,"kind":"choice","multi":false,"stem":"在短暂性脑缺血发作（TIA）诊断上，灵敏度最高的是","options":[["A","CT"],["B","MRI"],["C","脑血流灌注显像介入试验"],["D","脑脊液间隙显像"],["E","脑血流灌注显像"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"介入试验（如乙酰唑胺负荷）可明显提高TIA诊断灵敏度。"},{"id":1132,"kind":"choice","multi":false,"stem":"偏头痛患者脑血流灌注显像表现为","options":[["A","发病时局部脑血流量增加，临床症状消失后可以恢复正常"],["B","发病时及临床症状消失后局部脑血流量均增加"],["C","发病时局部脑血流量减少，临床症状消失后增加"],["D","发病时局部脑血流量减少，临床症状消失后正常"],["E","发病时及临床症状消失后局部脑血流量均降低"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"偏头痛发作期可见局部高灌注，缓解后恢复正常。"},{"id":1133,"kind":"choice","multi":false,"stem":"下列关于脑血管供血的描述错误的是","options":[["A","额叶外侧面和底面血供来自大脑中动脉，其中侧面血供来自大脑前动脉"],["B","顶叶血供主要来自大脑前动脉"],["C","颞叶外侧面血供来自大脑中动脉，内侧面血供来自大脑后动脉"],["D","枕部血供来自大脑后动脉"],["E","岛叶血供来自大脑中动脉"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"枕部血供来自大脑后动脉是正确的描述，因此本题问“错误的是”，根据标准答案D（原答案为D），但D内容本身正确，可能题目有误，但按标准答案，此处选D作为错误项（即认为D是错误的？但实际枕部确实来自大脑后动脉）。可能是原题答案有误，我们保留标准答案D。"},{"id":1134,"kind":"choice","multi":false,"stem":"路易体痴呆 (dementia with Lewy body) 脑血流灌注显像最常累及的部位是","options":[["A","双侧颞顶叶为主"],["B","双侧额叶为主"],["C","基底节、丘脑常受累"],["D","颞叶改变更为明显"],["E","枕叶改变更为明显"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"路易体痴呆常表现为双侧额叶低灌注。"},{"id":1135,"kind":"choice","multi":false,"stem":"在 SPECT 脑血流灌注显像中，脑梗死出现小脑失联络征，对侧小脑表现为","options":[["A","血流灌注增加"],["B","血流灌注减低"],["C","血流灌注不变"],["D","无血流灌注"],["E","血流灌注或增加或减低"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"11. 神经系统","topic3":"","diff":"","level":"","explanation":"交叉性小脑失联络是指小脑血流灌注减低，但本题问“对侧小脑”，正常小脑不受影响，应为不变。但标准答案为C，即不变。实际交叉失联络通常指梗死对侧小脑灌注减低，但这里明确“脑梗死出现小脑失联络征，对侧小脑”，可能描述有歧义，按标准答案保留C。"},{"id":1201,"kind":"choice","multi":false,"stem":"目前最常用的骨显像剂是","options":[["A","⁹⁹ᵐTc-PYP"],["B","⁸⁹Sr"],["C","¹⁸F-FDG"],["D","¹⁵³Sm"],["E","⁹⁹ᵐTc-MDP"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-MDP 是临床应用最广泛的骨显像剂。"},{"id":1202,"kind":"choice","multi":false,"stem":"全身骨显像注射显像剂后多长时间进行上机显像","options":[["A","1~2 小时"],["B","2~3 小时"],["C","7~9 小时"],["D","1~2 天"],["E","72 小时后"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨显像通常在注射后 2~3 小时进行，此时软组织本底较低。"},{"id":1203,"kind":"choice","multi":false,"stem":"放射性核素骨显像通常能较 X 射线检查提前多长时间发现骨转移性瘤","options":[["A","3~6 个月"],["B","1~2 个月"],["C","7~9 个月"],["D","6~12 个月"],["E","1~2 年"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨显像可在骨转移早期（提前 3-6 个月）发现病灶。"},{"id":1204,"kind":"choice","multi":false,"stem":"全身骨显像使用的探头是","options":[["A","高能通用"],["B","高能高分辨"],["C","低能高分辨"],["D","低能低分辨"],["E","高能低分辨"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc 为低能核素，常规使用低能高分辨准直器。"},{"id":1205,"kind":"choice","multi":false,"stem":"骨显像中反映软组织内血液分布情况的是","options":[["A","血流相"],["B","血池相"],["C","延迟相"],["D","血流相和血池相"],["E","血池相和延迟相"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"血池相（注射后 1~5 分钟）反映软组织血管床的分布。"},{"id":1206,"kind":"choice","multi":false,"stem":"下列哪种情况下骨显像图像上表现为放射性分布减低","options":[["A","原发性骨肿瘤"],["B","骨梗死"],["C","急性骨髓炎"],["D","蜂窝织炎"],["E","骨质增生"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨梗死因血供中断呈放射性减低（冷区）。"},{"id":1207,"kind":"choice","multi":false,"stem":"下列不是超级骨显像表现的是","options":[["A","全身骨骼分布呈均匀、对称性的异常浓聚"],["B","骨骼影像非常清晰"],["C","双肾常不显影"],["D","软组织内放射性分布极低"],["E","膀胱明显显影"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"超级骨显像时骨摄取增加，肾及膀胱显影减轻，膀胱明显显影不是其特征。"},{"id":1208,"kind":"choice","multi":false,"stem":"骨显像中混合型影像少见于","options":[["A","急性骨髓炎"],["B","骨无菌性坏死"],["C","关节感染"],["D","骨巨细胞瘤"],["E","骨囊肿"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨囊肿通常呈边界清晰的放射性减低区，混合型影像较少见。"},{"id":1209,"kind":"choice","multi":false,"stem":"临床上对乳腺癌骨转移诊断最灵敏的检查方法是","options":[["A","CT 检查"],["B","MRI 检查"],["C","碱性磷酸酶检测"],["D","放射性核素全身骨显像"],["E","钼靶摄片"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"全身骨显像对骨转移的灵敏度最高，可达 95% 以上。"},{"id":1210,"kind":"choice","multi":false,"stem":"正常儿童、青少年骨显像与成人有差异，全身骨骼影像较成人普遍增浓，最为明显的部位是","options":[["A","头颅"],["B","关节"],["C","骨骼"],["D","骨干"],["E","脊柱"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"儿童骨骺生长活跃，全身骨骼普遍增浓，骨骼部位最明显。"},{"id":1211,"kind":"choice","multi":false,"stem":"骨样骨瘤典型的骨显像表现是","options":[["A","放射性浓聚"],["B","“冷区”"],["C","“炸面圈”样改变"],["D","双密度表现"],["E","“穿凿”样改变"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨样骨瘤典型表现为中央低浓聚（瘤巢）周围高浓聚的“双密度”征。"},{"id":1212,"kind":"choice","multi":false,"stem":"下列恶性肿瘤中最易发生骨转移的是","options":[["A","前列腺癌"],["B","肝癌"],["C","甲状腺乳头状癌"],["D","肾癌"],["E","胃癌"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"前列腺癌、乳腺癌、肺癌是骨转移发生率最高的恶性肿瘤。"},{"id":1213,"kind":"choice","multi":false,"stem":"目前临床上常用的 ⁹⁹ᵐTc 标记的膦酸盐类骨显像剂，其分子中含有的化学键是","options":[["A","P—N—P"],["B","P—C—P"],["C","P—O—P"],["D","N—O—N"],["E","N—C—N"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"膦酸盐类含 P—C—P 键，对骨组织有高亲和力。"},{"id":1214,"kind":"choice","multi":false,"stem":"急性骨髓炎在发病多长时间后核素骨显像便可发现异常","options":[["A","1～2周"],["B","1～2小时"],["C","3～5天"],["D","24小时"],["E","1～2个月"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"急性骨髓炎发病 24 小时内骨显像即可出现异常浓聚。"},{"id":1215,"kind":"choice","multi":false,"stem":"下列骨显像表现不提示病灶好转的是","options":[["A","病灶显影变淡"],["B","范围缩小"],["C","数量减少"],["D","闪烁现象"],["E","超级骨显像"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"超级骨显像反映骨骼普遍代谢增高，不提示局部病灶好转。"},{"id":1216,"kind":"choice","multi":false,"stem":"以下哪项不是多发性骨髓瘤常见的影像学表现","options":[["A","放射性浓聚"],["B","“冷区”"],["C","“炸面圈”样改变"],["D","双密度表现"],["E","“穿凿”样改变"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"多发性骨髓瘤常见冷区、炸面圈征、穿凿样改变，双密度征多见于骨样骨瘤。"},{"id":1217,"kind":"choice","multi":false,"stem":"蜂窝织炎三时相骨显像的影像特点是","options":[["A","血流相、血池相正常，延迟相放射性明显增加"],["B","血流相、血池相弥漫性放射性增加，且逐渐减低，延迟骨摄取减低"],["C","血流相、血池相局部放射性增加，且消失缓慢，延迟相正常"],["D","血流相放射性明显增加，血池相及延迟相呈放射性降低"],["E","血流相、血池相及延迟相放射性均明显增加"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"蜂窝织炎属于软组织感染，血流相、血池相增高，延迟相骨摄取不高或减低。"},{"id":1218,"kind":"choice","multi":false,"stem":"骨显像剂 ⁹⁹ᵐTc-MDP 在静脉注射后几小时 50%～60% 集聚在骨表面，其余的则通过肾由泌尿系统排出","options":[["A","0.5小时"],["B","1小时"],["C","2小时"],["D","4小时"],["E","6小时"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"注射后约 2 小时，骨摄取达峰值（约 50-60%）。"},{"id":1219,"kind":"choice","multi":false,"stem":"既能用于骨骼显像又能用于心肌梗死显像的显像剂是","options":[["A","⁹⁹ᵐTc-MDP"],["B","⁹⁹ᵐTc-PYP"],["C","⁸⁹Sr"],["D","⁹⁹ᵐTc-HDP"],["E","⁹⁹ᵐTc-MIBI"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-PYP 可用于骨显像和急性心肌梗死显像。"},{"id":1220,"kind":"choice","multi":false,"stem":"放射性核素骨显像与X射线平片比较，其优点是","options":[["A","可一次性显示全身骨骼的影像"],["B","能较早地发现骨骼系统病变（如骨转移性肿瘤）"],["C","三时相骨显像对鉴别骨骼系统疾病的良恶性有一定的价值"],["D","发现病变的范围可能较X射线平片宽"],["E","以上都是"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨显像的上述优点均为与X平片相比的优势。"},{"id":1221,"kind":"choice","multi":false,"stem":"诊断下列哪种疾病，骨显像不是首选","options":[["A","骨结核"],["B","骨转移"],["C","股骨头缺血坏死"],["D","应力性骨折"],["E","骨移植监测"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨结核首选 CT 或 MRI，骨显像特异性较低。"},{"id":1222,"kind":"choice","multi":false,"stem":"下列哪项不是代谢性骨病的共同特征","options":[["A","全身骨骼的放射性分布对称性增高"],["B","中轴骨显像剂摄取增高"],["C","四肢长骨显像剂摄取增高"],["D","关节放射性分布呈对称性增高"],["E","肋骨软骨连接处有明显的显像剂摄取，呈“串珠样”改变"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"代谢性骨病主要表现为骨摄取增高，关节一般不呈对称性增高。"},{"id":1223,"kind":"choice","multi":false,"stem":"骨显像显示骨病灶与X射线诊断相比较，其灵敏度和特异性是","options":[["A","灵敏度和特异性均高"],["B","灵敏度和特异性均低"],["C","灵敏度高而特异性低"],["D","灵敏度低而特异性高"],["E","灵敏度和特异性均相似"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"12. 骨骼系统","topic3":"","diff":"","level":"","explanation":"骨显像灵敏度高但特异性较低，X线特异性高但灵敏度低。"},{"id":1224,"kind":"choice","multi":false,"stem":"骨四时相显像的最佳显像时间顺序为","options":[["A","注射前，注射后即刻，2～4小时，18～24小时"],["B","注射后即刻，1～5分钟，2～4小时，18～24小时"],["C","注射中，2～4小时，24小时，48小时"],["D","注射后即刻，1～5分钟，2～4小时，6小时"],["E","注射后1～5分钟，2～4小时，6小时，20小时"]],"answer":"B","type":"A1型题","topic1":"核医学"," ᵐTc-EHIDA"],["E","⁹⁹ᵐTc-DTPA"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTcO₄⁻ 被胃黏膜细胞摄取。"},{"id":1509,"kind":"choice","multi":false,"stem":"Barrett食管显像应用哪种体位采集","options":[["A","右侧卧位"],["B","左侧卧位"],["C","左前斜"],["D","右前斜"],["E","直立位"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"Barrett食管显像时采用直立位，以减少胃酸反流影响。"},{"id":1510,"kind":"choice","multi":false,"stem":"儿童消化道出血病灶定位诊断时，首选的无创检查方法是","options":[["A","十二指肠-胃反流显像"],["B","异位胃黏膜显像"],["C","胃肠动力学显像"],["D","胃肠道X线动脉造影"],["E","⁵¹Cr-RBC 胃肠道出血显像"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"异位胃黏膜显像对儿童梅克尔憩室出血的诊断价值高。"},{"id":1511,"kind":"choice","multi":false,"stem":"异位胃黏膜显像诊断梅克尔憩室患者需要准备的项目是","options":[["A","清洁口腔"],["B","服用抗生素"],["C","灌肠作肠道准备"],["D","禁食4小时"],["E","口服甲氧氯普胺"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"禁食可减少胃液分泌及肠蠕动干扰。"},{"id":1512,"kind":"choice","multi":false,"stem":"胃食管反流指数至少超过多少判断为胃食管反流","options":[["A","1%"],["B","2%"],["C","3%"],["D","4%"],["E","5%"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"通常以反流指数 >4% 作为阳性标准。"},{"id":1513,"kind":"choice","multi":false,"stem":"固体和液体食物的胃排空开始时间是","options":[["A","固体和液体食物进入胃后开始"],["B","固体和液体食物进入胃后均延迟一段时间"],["C","液体食物延迟一段时间，固体食物立刻开始"],["D","固体食物延迟一段时间，液体食物立刻开始"],["E","没有一定规律"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"液体排空即刻开始，固体食物需经研磨后才开始排空。"},{"id":1514,"kind":"choice","multi":false,"stem":"诊断胃轻瘫首选的放射性标记物试验是","options":[["A","固体食物"],["B","液体食物"],["C","混合性食物"],["D","胶体类食物"],["E","固体或液体食物"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"胃轻瘫主要影响固体排空，故首选固体食物。"},{"id":1515,"kind":"choice","multi":false,"stem":"机械性胃梗阻在胃排空功能测定中表现为","options":[["A","固体食物排空时间延长"],["B","液体食物排空时间延长"],["C","固体和液体食物排空时间都延长"],["D","固体食物排空时间延长，液体食物排空时间正常"],["E","固体食物排空时间正常，液体食物排空时间延长"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"机械性梗阻只阻碍固体排空，液体可通过。"},{"id":1516,"kind":"choice","multi":false,"stem":"功能性胃梗阻在胃排空功能测定表现为","options":[["A","固体食物排空时间延长"],["B","液体食物排空时间延长"],["C","固体和液体食物排空时间都延长"],["D","固体食物排空时间延长，液体食物排空时间正常"],["E","固体食物排空时间正常，液体食物排空时间延长"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"功能性梗阻（胃轻瘫）影响固体和液体排空。"},{"id":1517,"kind":"choice","multi":false,"stem":"放射性核素食管通过显像常用的显像剂是放射性核素标记的","options":[["A","固体食物"],["B","液体食物"],["C","混合性食物"],["D","胶体类食物"],["E","仅为少许显像剂"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"食管通过显像通常采用液体试餐。"},{"id":1518,"kind":"choice","multi":false,"stem":"十二指肠-胃反流显像常用的显像剂为","options":[["A","⁹⁹ᵐTc-硫胶体"],["B","⁹⁹ᵐTc-RBC"],["C","⁹⁹ᵐTc-EHIDA"],["D","⁹⁹ᵐTc-DTPA"],["E","⁹⁹ᵐTcO₄⁻"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"EHIDA 经肝胆排泄进入肠道，可观察反流。"},{"id":1519,"kind":"choice","multi":false,"stem":"正常唾液腺显像口服维生素C后可见","options":[["A","唾液腺影像减低，口腔内显像剂分布减低"],["B","唾液腺影像不变，口腔内显像剂分布增加"],["C","唾液腺影像减低，口腔内显像剂分布增加"],["D","唾液腺影像不变，口腔内显像剂分布减低"],["E","唾液腺影像不变，口腔内显像剂分布不变"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"维生素C刺激唾液分泌，使唾液腺影像减低，口腔内放射性增高。"},{"id":1520,"kind":"choice","multi":false,"stem":"¹⁴C-尿素呼气试验是基于下列哪项原理","options":[["A","人体产生 CO₂"],["B","胃能分解尿素"],["C","肠道内含有尿素酶"],["D","细菌含有尿素酶"],["E","胃内含有尿素酶"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"幽门螺杆菌含尿素酶，分解尿素产生 ¹⁴CO₂。"},{"id":1521,"kind":"choice","multi":false,"stem":"静脉注射肝胆动态显像剂后可被肝内何种细胞摄取","options":[["A","肝单核吞噬细胞"],["B","胆管细胞"],["C","血管上皮细胞"],["D","肝细胞"],["E","转移性肿瘤细胞"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"IDA 类药物被肝细胞摄取并排泄。"},{"id":1522,"kind":"choice","multi":false,"stem":"肝胆动态显像剂不包括","options":[["A","⁹⁹ᵐTc-HIDA"],["B","⁹⁹ᵐTc-EHIDA"],["C","⁹⁹ᵐTc-PMT"],["D","⁹⁹ᵐTc-DISIDA"],["E","⁹⁹ᵐTc-植酸盐"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"植酸盐用于肝脾胶体显像，非肝胆动态显像剂。"},{"id":1523,"kind":"choice","multi":false,"stem":"与 ⁹⁹ᵐTc-IDA 结构最为相似的生理物质是","options":[["A","球蛋白"],["B","胆汁酸"],["C","维生素 B₁₂"],["D","胆红素"],["E","葡萄糖醛酸"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"IDA 与胆红素共享有机阴离子转运途径。"},{"id":1524,"kind":"choice","multi":false,"stem":"放射性核素肝胆动态显像患者应至少禁食","options":[["A","1 小时"],["B","2 小时"],["C","3 小时"],["D","4 小时"],["E","5 小时"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"禁食 4 小时以上，避免进食影响胆囊排空。"},{"id":1525,"kind":"choice","multi":false,"stem":"肝脏动态显像诊断先天性胆管闭锁一般以显像后多长时间肠道无放射性为准","options":[["A","1 小时"],["B","4 小时"],["C","6 小时"],["D","12 小时"],["E","24 小时"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"24小时肠道仍不显影，可诊断胆道闭锁。"},{"id":1526,"kind":"choice","multi":false,"stem":"在放射性核素肝胆动态显像诊断先天性胆道闭锁时，为提高诊断的准确性，应使用的药物是","options":[["A","促胆囊收缩素"],["B","辛卡利特"],["C","吗啡"],["D","苯巴比妥"],["E","阿司匹林"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"苯巴比妥可诱导肝酶，促进胆汁排泄，提高显像阳性率。"},{"id":1527,"kind":"choice","multi":false,"stem":"先天性胆道闭锁的肝胆动态显像影像特点是","options":[["A","肝胆影像出现和消退延缓"],["B","肠道内放射性出现延迟"],["C","胆囊显影明显延缓"],["D","胆系和肠道内始终不出现放射性"],["E","肝脏和胆囊影像始终不出现"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"胆道闭锁时，胆红素无法排入肠道。"},{"id":1528,"kind":"choice","multi":false,"stem":"肝胆动态显像时进食脂肪餐的目的是","options":[["A","改善胆道影像质量"],["B","不使泌尿系统显影"],["C","了解胆囊收缩功能"],["D","黄疸的鉴别诊断"],["E","防止肝脏摄取放射性过多而影响胆道显影效果"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"脂肪餐刺激胆囊收缩，评估胆囊排空功能。"},{"id":1529,"kind":"choice","multi":false,"stem":"慢性胆囊炎肝胆动态显像的表现是","options":[["A","胆囊显影延迟，肠道显影早于胆囊"],["B","胆囊始终不显影，但肝、肝管、胆总管及肠道显像正常"],["C","胆囊显像增浓，肠道显像延迟"],["D","胆囊显影时间提前，肝、肝管、胆总管及肠道显像正常"],["E","胆囊显像增大，胆囊内可见占位性病变"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"慢性胆囊炎胆囊浓缩功能受损，显影延迟。"},{"id":1530,"kind":"choice","multi":false,"stem":"肝脏的血液供应，主要来自","options":[["A","肝动脉"],["B","肝静脉"],["C","肝小叶中央静脉"],["D","门静脉"],["E","肠系膜上动脉"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝脏约 75% 血流来自门静脉。"},{"id":1531,"kind":"choice","multi":false,"stem":"肝动脉灌注显像的正常影像是","options":[["A","肝脏影像较双肾影先出现"],["B","肝脏影像较脾脏影先出现"],["C","肝脏影像与双肾影同时出现"],["D","肝脏影像与脾脏影同时出现"],["E","肝脏影像迟于双肾显影出现"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝动脉灌注显像时，肝显影晚于肾（肾血流更丰富）。"},{"id":1532,"kind":"choice","multi":false,"stem":"肝癌肝血池显像的典型表现为病灶处放射性较周围肝组织","options":[["A","增高"],["B","相似"],["C","稍低"],["D","减低"],["E","明显减低"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝癌血管较少，血池相放射性与周围肝组织相似或减低。"},{"id":1533,"kind":"choice","multi":false,"stem":"肝脏海绵状血管瘤典型的核医学影像表现是","options":[["A","肝血流显像呈部分填充"],["B","肝血流显像未见填充"],["C","肝血流显像呈过度填充"],["D","肝脾胶体显像呈放射性分布浓聚"],["E","肝脏肿瘤阳性显像呈放射性浓聚"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"血管瘤血池大，血流相及血池相呈过度填充。"},{"id":1534,"kind":"choice","multi":false,"stem":"肝血流灌注和血池显像，下面描述不正确的是","options":[["A","主要用于发现肝内占位性病变"],["B","主要用于肝内占位性病变性质的鉴别诊断"],["C","正常时，在腹主动脉和脾、肾血管床显影时（称动脉相），肝影不明显"],["D","肝恶性病变在动脉相即可见到病变局部有放射性充盈（动脉灌注阳性）"],["E","血池影像各部位放射性高低反映局部血管量的多少"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝血流灌注和血池显像主要用于占位性病变的定性鉴别，而非发现占位。"},{"id":1535,"kind":"choice","multi":false,"stem":"肝胆动态显像最常用于诊断","options":[["A","婴儿持续性黄疸鉴别"],["B","急性胆囊炎"],["C","胆结石"],["D","胆总管梗阻"],["E","十二指肠-胃反流"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝胆动态显像是鉴别婴儿先天性胆道闭锁与新生儿肝炎的首选方法。"},{"id":1536,"kind":"choice","multi":false,"stem":"肝细胞黄痘患者作肝胆动态显像，一般不可能出现的是","options":[["A","心前区放射性增高"],["B","肝显影差"],["C","肾脏血池增加"],["D","肝脏系统显影不佳"],["E","肠道持续无放射性"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"15. 消化系统","topic3":"","diff":"","level":"","explanation":"肝细胞黄疸时，肝胆系统显影差，但肠道仍可有少量放射性（不同于胆道闭锁）。"},{"id":1601,"kind":"choice","multi":false,"stem":"肺灌注显像示踪剂 ⁹⁹ᵐTc-MAA 的直径是","options":[["A","< 9μm"],["B","> 9μm"],["C","0.1~0.3mm"],["D","0.3~0.6mm"],["E","> 0.6mm"]],"answer":"B","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"MAA 颗粒直径大于 9μm，可暂时栓塞肺毛细血管，反映肺血流分布。"},{"id":1602,"kind":"choice","multi":false,"stem":"肺灌注显像时，一次注射的适宜 ⁹⁹ᵐTc-MAA 颗粒数为","options":[["A","5万~10万"],["B","10万~20万"],["C","20万~70万"],["D","70万~100万"],["E","> 100万"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"注射 20~70 万颗粒，足以显像且不引起血流动力学明显改变。"},{"id":1603,"kind":"choice","multi":false,"stem":"以下哪种病症不是肺灌注显像的适应证","options":[["A","肺部分切除术前评估"],["B","肺动脉高压"],["C","大动脉炎肺动脉可疑受累"],["D","慢性阻塞型肺部疾病"],["E","肺炎"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"肺炎属感染性病变，不是肺灌注显像的适应证。"},{"id":1604,"kind":"choice","multi":false,"stem":"肺栓塞肺灌注/通气显像的典型征象是","options":[["A","灌注显像有缺损，通气显像正常"],["B","灌注和通气显像都有缺损"],["C","灌注显像正常，通气显像有缺损"],["D","灌注和通气显像都无缺损"],["E","以上都是"]],"answer":"A","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"肺栓塞表现为局部血流缺损但通气正常（不匹配）。"},{"id":1605,"kind":"choice","multi":false,"stem":"肺灌注显像注射显像剂时，以下哪种方法最正确","options":[["A","“弹丸”式静脉注射"],["B","快速静脉注射"],["C","立位静脉注射"],["D","平卧位缓慢静脉注射"],["E","坐位静脉注射"]],"answer":"D","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"平卧位缓慢注射可使颗粒均匀分布于肺毛细血管。"},{"id":1606,"kind":"choice","multi":false,"stem":"以下哪项不是肺通气显像的显像剂","options":[["A","锝气体（Technegas）"],["B","⁹⁹ᵐTc-DTPA 气溶胶"],["C","⁹⁹ᵐTc-MAA"],["D","⁸¹ᵐKr"],["E","¹³³Xe"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"⁹⁹ᵐTc-MAA 用于肺灌注显像，非通气显像剂。"},{"id":1607,"kind":"choice","multi":false,"stem":"以下哪项不是肺通气显像的适应证","options":[["A","与肺灌注显像配合鉴别诊断肺栓塞或 COPD"],["B","肺实质性疾病的诊断，治疗效果的观察及预后评价"],["C","通过测定灌注/通气比值判定肺功能"],["D","阻塞性肺疾病的诊断及病变部位的确定"],["E","肺癌的定性诊断"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"肺通气显像不能定性诊断肺癌。"},{"id":1608,"kind":"choice","multi":false,"stem":"以下哪项条件不能排除肺栓塞的诊断","options":[["A","没有肺叶、肺段或亚段水平的不匹配改变"],["B","双肺各肺段灌注均正常"],["C","2个肺段的肺通气/灌注显像不匹配"],["D","肺通气/灌注显像中病灶的大小、形态和数量均匹配"],["E","肺通气/灌注显像中病灶的大小、形态和数量反向不匹配"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"肺段不匹配是肺栓塞的典型表现，不能排除肺栓塞。"},{"id":1609,"kind":"choice","multi":false,"stem":"以下哪种疾病一般不会造成肺灌注显像的异常","options":[["A","大动脉炎累及肺动脉"],["B","肺栓塞"],["C","肺癌侵犯肺动脉"],["D","COPD"],["E","轻度支气管哮喘"]],"answer":"E","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"轻度哮喘不影响肺血流分布，灌注显像可正常。"},{"id":1610,"kind":"choice","multi":false,"stem":"静脉注射 ⁹⁹ᵐTc-MAA 时，如回血过多，与 ⁹⁹ᵐTc-MAA 凝聚成大颗粒，显像时可出现","options":[["A","一侧肺不显像"],["B","一叶肺不显像"],["C","肺内出现“热点”"],["D","肺内出现弥漫性放射性稀疏区"],["E","肺显像正常"]],"answer":"C","type":"A1型题","topic1":"核医学","topic2":"16. 呼吸系统","topic3":"","diff":"","level":"","explanation":"凝聚的大颗粒形成局部栓塞，表现为热点。"},{"id":1611,"kind":"choice","multi":false,"stem":"以下哪种疾病的肺灌注/通气显像最易与肺栓塞混淆","options <script>
(function () {
  'use strict';

  var QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
  var LS_KEY = 'nuclear_quiz_v1';

  var S = {
    pool: [], idx: 0, mode: 'order',
    records: {}, fav: [], wrong: [],
    pending: [], started: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uniq(a) {
    var out = [], seen = {};
    a.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      S.records = o.records || {};
      S.fav = o.fav || [];
      S.wrong = o.wrong || [];
      S.mode = o.mode || 'order';
    } catch (e) {}
  }
  function saveState() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        records: S.records, fav: S.fav, wrong: S.wrong, mode: S.mode
      }));
    } catch (e) {}
  }

  function fillSelect(el, list) {
    el.innerHTML = '<option value="">全部</option>' +
      list.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  }

  function boot() {
    loadState();
    fillSelect($('fTopic'), uniq(QUESTIONS.map(function (q) { return q.topic2; })));
    $('mode').value = S.mode;

    $('startBtn').onclick = start;
    $('resetBtn').onclick = resetAll;
    $('panelBtn').onclick = function () { $('panel').classList.toggle('hidden'); };
    $('prevBtn').onclick = function () { go(-1); };
    $('nextBtn').onclick = function () { go(1); };
    $('revealBtn').onclick = reveal;
    $('submitBtn').onclick = function () { submitCur(S.pending.slice()); };
    $('favBtn').onclick = toggleFav;

    document.addEventListener('keydown', function (e) {
      if ($('quiz').classList.contains('hidden')) return;
      var q = S.pool[S.idx];
      if (!q) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') { go(-1); }
      else if (e.key === 'ArrowRight') { go(1); }
      else if (/^[a-eA-E]$/.test(e.key) && q.kind === 'choice') {
        if (S.mode === 'recite') return;
        if (S.records[q.id]) return;
        var k = e.key.toUpperCase();
        if (q.options.some(function (o) { return o[0] === k; })) {
          e.preventDefault();
          onPick(q, k);
        }
      }
    });

    updateStats();
  }

  function buildPool() {
    var fTopic = $('fTopic').value;
    var arr = QUESTIONS.filter(function (q) {
      if (fTopic && q.topic2 !== fTopic) return false;
      return true;
    });
    if (S.mode === 'wrong') {
      arr = arr.filter(function (q) { return S.wrong.indexOf(q.id) >= 0; });
    } else if (S.mode === 'fav') {
      arr = arr.filter(function (q) { return S.fav.indexOf(q.id) >= 0; });
    }
    if (S.mode === 'random') {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
    return arr;
  }

  function start() {
    S.mode = $('mode').value;
    saveState();
    var pool = buildPool();
    if (!pool.length) {
      alert(S.mode === 'wrong' ? '错题本是空的，先去练习吧~'
        : S.mode === 'fav' ? '收藏夹是空的哦~'
        : '当前筛选条件下没有题目，请调整筛选条件。');
      return;
    }
    S.pool = pool;
    S.idx = 0;
    S.started = true;
    S.pending = [];
    $('quiz').classList.remove('hidden');
    $('sheetPanel').classList.remove('hidden');
    $('panel').classList.add('hidden');
    $('submitBtn').classList.add('hidden');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetAll() {
    if (!confirm('确定要清空所有答题记录、错题和收藏吗？此操作不可恢复。')) return;
    S.records = {}; S.fav = []; S.wrong = [];
    saveState();
    updateStats();
    if (S.started) render();
  }

  function cur() { return S.pool[S.idx]; }

  function render() {
    var q = cur();
    if (!q) return;

    var isRecite = S.mode === 'recite';
    var rec = S.records[q.id] || null;
    var answered = !!rec;

    $('qIndex').textContent = (S.idx + 1) + ' / ' + S.pool.length;
    $('qType').textContent = q.type || '单选题';

    var topicEl = $('qTopic');
    var topicText = [q.topic2, q.topic3].filter(Boolean).join(' · ');
    if (topicText) {
      topicEl.textContent = topicText;
      topicEl.style.display = '';
    } else {
      topicEl.style.display = 'none';
    }

    $('stem').textContent = q.stem || '（无题干）';

    var box = $('options');
    var fb = $('feedback');
    box.innerHTML = '';
    fb.className = 'feedback';
    fb.textContent = '';

    var fav = S.fav.indexOf(q.id) >= 0;
    $('favBtn').textContent = fav ? '★ 已收藏' : '☆ 收藏';

    $('revealBtn').classList.toggle('hidden', answered || isRecite);
    $('submitBtn').classList.add('hidden');

    if (q.kind === 'choice') {
      var chosen = (rec && rec.sel) ? rec.sel : [];
      var rightKeys = q.answer.split('');

      q.options.forEach(function (pair) {
        var k = pair[0], t = pair[1];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.dataset.k = k;

        var kk = document.createElement('span');
        kk.className = 'k'; kk.textContent = k;
        var tt = document.createElement('span');
        tt.className = 't'; tt.textContent = t;
        b.appendChild(kk); b.appendChild(tt);

        if (chosen.indexOf(k) >= 0) b.classList.add('sel');

        if (answered || isRecite) {
          b.disabled = true;
          if (rightKeys.indexOf(k) >= 0) b.classList.add('ok');
          else if (chosen.indexOf(k) >= 0) b.classList.add('bad');
        } else {
          b.onclick = function () { onPick(q, k); };
        }
        box.appendChild(b);
      });

      if (answered) {
        showFeedback(q, rec);
      } else if (isRecite) {
        showAnswerOnly(q);
      } else if (q.multi) {
        S.pending = [];
        $('submitBtn').classList.remove('hidden');
        $('submitBtn').disabled = true;
      }
    }

    $('prevBtn').disabled = (S.idx === 0);
    $('nextBtn').disabled = (S.idx >= S.pool.length - 1);
    $('bar').style.width = (((S.idx + 1) / S.pool.length) * 100).toFixed(2) + '%';

    renderSheet();
  }

  function showAnswerOnly(q) {
    var fb = $('feedback');
    fb.className = 'feedback info show';
    fb.textContent = '正确答案：' + q.answer;
    if (q.explanation) {
      var ex = document.createElement('div');
      ex.className = 'explain';
      ex.textContent = '解析：' + q.explanation;
      fb.appendChild(ex);
    }
  }

  function showFeedback(q, rec) {
    var fb = $('feedback');
    if (rec.ok === true) {
      fb.className = 'feedback ok show';
      fb.textContent = '✓ 回答正确　　正确答案：' + q.answer;
    } else if (rec.ok === false) {
      fb.className = 'feedback bad show';
      fb.textContent = '✗ 回答错误　　正确答案：' + q.answer +
        (rec.sel && rec.sel.length ? '　　你的选择：' + rec.sel.join('') : '');
    } else {
      fb.className = 'feedback info show';
      fb.textContent = '正确答案：' + q.answer;
    }
    if (q.explanation) {
      var ex = document.createElement('div');
      ex.className = 'explain';
      ex.textContent = '解析：' + q.explanation;
      fb.appendChild(ex);
    }
  }

  function onPick(q, k) {
    if (S.mode === 'recite') return;
    if (S.records[q.id]) return;
    if (q.multi) {
      var i = S.pending.indexOf(k);
      if (i >= 0) S.pending.splice(i, 1);
      else S.pending.push(k);
      Array.prototype.forEach.call(document.querySelectorAll('#options .opt'), function (el) {
        el.classList.toggle('sel', S.pending.indexOf(el.dataset.k) >= 0);
      });
      $('submitBtn').disabled = S.pending.length === 0;
    } else {
      submitCur([k]);
    }
  }

  function submitCur(sel) {
    var q = cur();
    if (!q || q.kind !== 'choice' || S.records[q.id]) return;
    if (S.mode === 'recite') return;
    var right = q.answer.split('').sort().join('');
    var mine = sel.slice().sort().join('');
    var ok = (right === mine);
    S.records[q.id] = { sel: sel.slice(), ok: ok };
    var wi = S.wrong.indexOf(q.id);
    if (!ok) { if (wi < 0) S.wrong.push(q.id); }
    else if (wi >= 0) { S.wrong.splice(wi, 1); }
    saveState();
    S.pending = [];
    render();
    updateStats();
  }

  function reveal() {
    var q = cur();
    if (!q) return;
    if (!S.records[q.id]) {
      S.records[q.id] = { sel: [], ok: false };
      if (S.wrong.indexOf(q.id) < 0) S.wrong.push(q.id);
      saveState();
      updateStats();
    }
    render();
  }

  function toggleFav() {
    var q = cur();
    if (!q) return;
    var i = S.fav.indexOf(q.id);
    if (i >= 0) S.fav.splice(i, 1);
    else S.fav.push(q.id);
    saveState();
    $('favBtn').textContent = i >= 0 ? '☆ 收藏' : '★ 已收藏';
  }

  function go(step) {
    var n = S.idx + step;
    if (n < 0 || n >= S.pool.length) return;
    S.idx = n;
    S.pending = [];
    render();
  }

  function renderSheet() {
    var el = $('sheet');
    el.innerHTML = '';
    S.pool.forEach(function (q, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(i + 1);
      var r = S.records[q.id];
      if (r) {
        if (r.ok === true) b.classList.add('ok');
        else if (r.ok === false) b.classList.add('bad');
        else b.classList.add('seen');
      }
      if (i === S.idx) b.classList.add('cur');
      b.onclick = function () { S.idx = i; S.pending = []; render(); };
      el.appendChild(b);
    });
    var done = S.pool.filter(function (q) { return !!S.records[q.id]; }).length;
    $('sheetInfo').textContent = '本组 ' + S.pool.length + ' 题，已做 ' + done + ' 题';
  }

  function updateStats() {
    var total = QUESTIONS.length, answered = 0, right = 0, wrong = 0;
    for (var k in S.records) {
      if (!Object.prototype.hasOwnProperty.call(S.records, k)) continue;
      var r = S.records[k];
      if (r.ok === true) { answered++; right++; }
      else if (r.ok === false) { answered++; wrong++; }
      else if (r.seen) answered++;
    }
    var rate = (right + wrong) ? Math.round(right * 100 / (right + wrong)) : 0;
    $('stats').innerHTML =
      '<span>题库 <b>' + total + '</b> 题</span>' +
      '<span>已做 <b>' + answered + '</b></span>' +
      '<span>正确率 <b>' + rate + '%</b></span>' +
      '<span>错题 <b>' + S.wrong.length + '</b></span>';
  }

  boot();
})();
</script>
</body>
</html>
