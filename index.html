<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>题库总览</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#eef2f7;color:#24313f;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:36px 18px 80px}
header{margin-bottom:26px}
h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
.sub{margin:0;color:#7b8794;font-size:14px}
.sub b{color:#2f7ae5;font-size:16px}
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
#search{width:100%;border:1px solid #dbe2ea;border-radius:11px;padding:11px 15px;font-size:15px;
  font-family:inherit;outline:none;background:#fff;color:#24313f}
#search:focus{border-color:#2f7ae5;box-shadow:0 0 0 3px rgba(47,122,229,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid #dbe2ea;background:#fff;border-radius:999px;padding:6px 15px;font-size:13px;
  color:#5b6975;cursor:pointer;font-family:inherit;transition:.15s}
.tab:hover{border-color:#9fc0ec;color:#2f7ae5}
.tab.active{background:#2f7ae5;border-color:#2f7ae5;color:#fff}
.group{margin-bottom:30px}
.group h2{font-size:15px;color:#7b8794;font-weight:600;margin:0 0 12px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:block;background:#fff;border-radius:14px;padding:17px 19px;text-decoration:none;
  color:inherit;border:1px solid transparent;box-shadow:0 1px 3px rgba(20,40,70,.07);
  transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#9fc0ec;
  box-shadow:0 8px 24px -10px rgba(47,122,229,.35)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.subject{font-size:16px;font-weight:600;flex:1;word-break:break-word}
.arrow{color:#b9c8d9;font-size:16px;transition:.15s}
.card:hover .arrow{color:#2f7ae5;transform:translateX(3px)}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.badge{background:#e8f1ff;color:#2f7ae5;padding:2px 10px;border-radius:999px;font-weight:600}
.date{color:#98a4b0}
.empty{text-align:center;color:#8b97a3;padding:60px 10px;font-size:15px}
@media (max-width:560px){
  .wrap{padding:22px 14px 60px}
  h1{font-size:22px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>题库总览</h1>
    <p class="sub" id="summary"></p>
  </header>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索科目或分类" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="list"></div>
</div>

<script id="qdata" type="application/json">[{"subject":"儿科学题库","category":"未分类","count":387,"updated":"2026-11-20","file":"/Practice/Pediatrics.html"}]</script>
<script>
(function () {
  'use strict';
  var QUIZZES = JSON.parse(document.getElementById('qdata').textContent);
  var searchEl = document.getElementById('search');
  var tabsEl = document.getElementById('tabs');
  var listEl = document.getElementById('list');
  var summaryEl = document.getElementById('summary');
  var activeCat = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function totalQuestions() {
    return QUIZZES.reduce(function (s, q) { return s + (q.count || 0); }, 0);
  }

  function allCats() {
    var seen = {}, out = [];
    QUIZZES.forEach(function (q) {
      if (q.category && !seen[q.category]) { seen[q.category] = 1; out.push(q.category); }
    });
    out.sort();
    return [''].concat(out);
  }

  function renderSummary() {
    summaryEl.innerHTML = '共 <b>' + QUIZZES.length + '</b> 个题库 · 合计 <b>' +
      totalQuestions() + '</b> 道题目';
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    allCats().forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (c === activeCat ? ' active' : '');
      b.textContent = c || '全部';
      b.onclick = function () { activeCat = c; renderTabs(); renderList(); };
      tabsEl.appendChild(b);
    });
  }

  function renderList() {
    var kw = searchEl.value.trim().toLowerCase();
    var filtered = QUIZZES.filter(function (q) {
      if (activeCat && q.category !== activeCat) return false;
      if (!kw) return true;
      return (q.subject + ' ' + q.category).toLowerCase().indexOf(kw) >= 0;
    });

    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的题库</div>';
      return;
    }

    var groups = {};
    filtered.forEach(function (q) {
      var c = q.category || '未分类';
      (groups[c] = groups[c] || []).push(q);
    });

    listEl.innerHTML = '';
    Object.keys(groups).sort().forEach(function (cat) {
      var sec = document.createElement('section');
      sec.className = 'group';
      var h = document.createElement('h2');
      h.textContent = cat;
      sec.appendChild(h);

      var grid = document.createElement('div');
      grid.className = 'grid';
      groups[cat].forEach(function (q) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = q.file;
        a.innerHTML =
          '<div class="card-top"><span class="subject">' + esc(q.subject) +
          '</span><span class="arrow">→</span></div>' +
          '<div class="card-meta">' +
          (q.count ? '<span class="badge">' + q.count + ' 题</span>' : '') +
          (q.updated ? '<span class="date">更新于 ' + esc(q.updated) + '</span>' : '') +
          '</div>';
        grid.appendChild(a);
      });
      sec.appendChild(grid);
      listEl.appendChild(sec);
    });
  }

  searchEl.addEventListener('input', renderList);

  renderSummary();
  renderTabs();
  renderList();
})();
</script>
</body>
</html>
