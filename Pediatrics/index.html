"topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"中","level":"本科生","id":66},{"kind":"text","stem":"被动免疫","answerText":"对未接受主动兔疫的易感儿在接触传染病后给予胎盘球蛋白、丙种球蛋白等注射 , 使小儿于短期内具有被动免疫力 , 称被动免疫。","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"中","level":"本科生","id":67},{"kind":"text","stem":"健康：","answerText":"WHO给健康所下的定义是：不仅是没有疾病疼痛，而且是个体身体上、精神上、社会上的完满状态。","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"易","level":"本科生","id":68},{"kind":"text","stem":"基础免疫：","answerText":"是指1周岁内完成的免疫程序，包括卡介苗、脊髓灰质炎三价混合疫苗、百日咳、白喉、破伤风类毒素混合制剂、麻疹减毒疫苗和乙型肝炎病毒疫苗的接种","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"难","level":"本科生","id":69},{"kind":"text","stem":"婴儿被动操：","answerText":"是指由成人给婴儿做四肢伸屈运动，可促进婴儿大运动的发育，改善全身血液循环。适用于2-6月的婴儿","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"中","level":"本科生","id":70},{"kind":"text","stem":"围产期：","answerText":"胎龄满 28 周 ( 体重 10OOg 〉至生后 7 足天 , 称为围生期或围产期。","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"各年龄期儿童的保健重点","diff":"中","level":"本科生","id":71},{"kind":"text","stem":"青春期：","answerText":"年龄范围为10-20岁，女孩的开始和结束年龄都比男孩早2年左右，此期儿童的个体生长发育加速，出现第二次高峰，同时生殖系统的发育也加速并渐趋成熟","type":"名词解释","topic1":"儿科学","topic2":"儿童保健原则","topic3":"各年龄期儿童的保健重点","diff":"中","level":"本科生","id":72},{"kind":"text","stem":"预防接种可能引起的反应及简单处理：","answerText":"卡介苗接种后2周左右局部出现红肿浸润，8-12周后结痂。若化脓形成小溃疡，腋下淋巴结肿大，可局部处理以防扩散，但不可切开；脊髓灰质炎三价混合疫苗接种后有极少数婴儿发生腹泻，但往往程度轻，能不治自愈；百日咳、白喉、破伤风类毒素混合制剂接种后局部可出现红肿、疼痛或低热，疲倦等，偶见过敏性皮疹、血管性水肿。若全身反应严重应及时送医院诊治；麻疹疫苗接种后少数人可在6-10日内出现轻微麻疹，予对症处理；乙肝疫苗接种后个别可有发热和局部疼痛，不必处理。","type":"简答题","topic1":"儿科学","topic2":"儿童保健原则","topic3":"儿童保健的具体措施","diff":"难","level":"本科生","id":73},{"kind":"text","stem":"简述预防接种的禁忌证有哪些。","answerText":"①患自身免疫性疾病、免疫缺陷病者； ②有明确过敏史者禁接种白喉类毒素、破 伤风类毒素、麻彦疫苗 ( 特别是鸡蛋过敏者)、脊髓灰质炎糖丸疫苗 ( 牛奶或奶制品过敏 )、乙肝疫苗 ( 酵母过敏或疫苗中任何成分过 敏 )；③患有结核病、急性传染病、肾炎、心脏 病、湿痊及其他皮肤病者不予接种卡介苗；④ 在接受免疫抑制剂治疗期间、发热、腹泻和急 性传染病期忌服脊髓灰质炎疫苗；⑤因百日咳茵茵偶可产生神经系统严重并发症,故本人及家庭成员患癫病、神经系统疾病有抽搐史者禁用百日咳菌苗；⑥患有肝炎、急性传染 病或其他严重疾病者不宜进行免疫接种。","typ 本科生","id":139},{"kind":"choice","multi":true,"stem":"1岁小儿发育应达到以下标准 :","options":[["A","体重 9kg"],["B","腕部骨化中心 2 个"],["C","头围 48cm"],["D","身高 85cm"],["E","能说出自己的名字"]],"answer":"AB","type":"X型题","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"易","level":"本科生","id":140},{"kind":"choice","multi":true,"stem":"7个月婴儿发育应达到以下标准 :","options":[["A","会伸手取物"],["B","能认识生人和熟人"],["C","能独坐"],["D","听懂自己的名字"],["E","会爬"]],"answer":"ABC","type":"X型题","topic1":"儿科学","topic2":"生长发育","topic3":"神经心理发育","diff":"易","level":"本科生","id":141},{"kind":"choice","multi":true,"stem":"关于小儿神经精神发育,下列哪些正确:","options":[["A","1 岁时能弯腰拾东西"],["B","18个月能表示大小便"],["C","9个月能模仿成人的动作"],["D","2岁能双脚跳"],["E","3岁能穿脱简单衣服"]],"answer":"ABCDE","type":"X型题","topic1":"儿科学","topic2":"生长发育","topic3":"神经心理发育","diff":"易","level":"本科生","id":142},{"kind":"choice","multi":true,"stem":"下列哪些属于生物功能行为问题 :","options":[["A","遗尿"],["B","吸吮手指"],["C","违拗"],["D","夜惊"],["E","过分挑剔饮食"]],"answer":"ADE","type":"X型题","topic1":"儿科学","topic2":"生长发育","topic3":"心理行为异常","diff":"中","level":"本科生","id":143},{"kind":"text","stem":"生长发育：","answerText":"生长是指小儿身体各器官、系统的长 大和形态变化,可以用测量方法表示其量的变化；发育是指细胞、组织、器官的分化完善 与功能的成熟 , 生长和发育两者紧密相连 , 生长是发育的物质基础 , 而发育又反映在生长的量的变化上","type":"名词解释","topic1":"儿科学","topic2":"生长发育","topic3":"生长发育规律","diff":"易","level":"本科生","id":144},{"kind":"text","stem":"生理性体重下降","answerText":"出生后由于摄入不足、胎粪排出和水 分丢失等致新生儿体重暂时性下降 (3%-9%), 称为生理性体重下降 , 约在出生后3-4天达到最低点 ,以后逐渐回升 ,7-10 天恢复到出生时的体重。","type":"名词解释","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"易","level":"本科生","id":145},{"kind":"text","stem":"身高（长）：","answerText":"指头部、脊柱和下肢长度的总和","type":"名词解释","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"易","level":"本科生","id":146},{"kind":"text","stem":"记忆：","answerText":"记忆是将所学得的信息贮存和读出的神经活动过程，可分为感觉、 短暂记忆和长久记忆3个不同的系统。","type":"名词解释","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"中","level":"本科生","id":147},{"kind":"text","stem":"遗尿症：","answerText":"正常小儿在2-3岁时已能控制排尿，如在5岁后仍发生不随意排尿即为遗尿症，大多数发生在夜间熟睡时，又称夜间遗尿症。","type":"名词解释","topic1":"儿科学","topic2":"生长发育","topic3":"心理行为异常","diff":"中","level":"本科生","id":148},{"kind":"text","stem":"屏气发作：","answerText":"为表现为呼吸运动暂停的一种异常性格行为问题，多发生于6-18月婴幼儿，5岁前会逐渐自然消失。其发作常在情绪急剧变化时，如发怒、剧烈叫喊等，常有过度换气，使呼吸中枢收到抑制，哭喊时屏气，脑血管扩张，脑缺氧时可有昏厥、丧失意志、口唇发绀，躯干四肢强直甚至抽搐，持续0.5-1秒后呼吸恢复，症状缓解。","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"心理行为异常","diff":"中","level":"本科生","id":149},{"kind":"text","stem":"儿童擦退综合征：","answerText":"是智力正常的儿童通过擦退引起兴奋的一种运动行为障碍，女孩与幼儿多见，表现为女孩喜欢坐硬物，手按腿或下腹部，双下肢伸直交叉夹紧或手抓住东西使劲；男孩俯卧在床上来回蹭，或同女孩表现，发作时神智清楚","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"心理行为异常","diff":"中","level":"本科生","id":150},{"kind":"text","stem":"Gesell发育量表：","answerText":"是评价儿童神经心理发育的诊断性量表，适用于4周至3岁的婴幼儿，从大动作、精细动作、个人社会、语言和适应行为五个方面进行测试，结果以发育商DQ表示。","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"儿童神经心理发育的评价","diff":"中","level":"本科生","id":151},{"kind":"text","stem":"学习障碍：","answerText":"属于特殊发育障碍，是指在获得和运用听、说、读、写、计算、推理等特殊技能上有明显困难，并表现为相应的多种障碍综合征。","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"心理行为异常","diff":"中","level":"本科生","id":152},{"kind":"text","stem":"简述衡量体格生长的常用方法有哪些？","answerText":"①均值离差法 ; ②百分位、中位数法 ; ③标准差比值法 ; ④指数法 ; ⑤生长曲线图评价法","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"易","level":"本科生","id":153},{"kind":"text","stem":"简述小儿生长发育规律。","answerText":"生长发育是连续的过程；各系统、器官发育不平衡；生长发育遵循由上到下, 由近到远 , 由粗到细 , 由低级到高级 , 由简单到复杂的一般规律 ; 生长发育存在个体差异。","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"生长发育规律","diff":"易","level":"本科生","id":154},{"kind":"text","stem":"简述评价体格生长有哪些要求。","answerText":"为了正确评价儿童体格生长状况 , 必须注意 : ①采用规范的测量用具和正确的测量方法 , 获得准确的测量数据 ; ②必须定期纵向观察,了解儿童的生长趋势,不能单凭 l 次检查结果就作出结论；③根据不同对象选用合适的参考人群值； ④体格生长评价内容应包括发育水平,生长速度和匀称程度 3 个方面。","type":"简答题","topic1":"儿科学","topic2":"生长发育","topic3":"体格生长","diff":"易","level":"本科生","id":155},{"kind":"choice","multi":false,"stem":"An infant can move his head from side to side while following a moving object, can lift his head from a prone position 45° off the examining table, smiles when encouraged, and makes cooing sounds. He 人工喂养"],["D","静脉输入高张葡萄糖补充热量"],["E","开始供给低热量和营养物质, 而后逐渐增加"]],"answer":"E","type":"A2型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":210},{"kind":"choice","multi":false,"stem":"足月顺产正常新生儿 11 天时 , 体重3kg, 每日约喂以配方奶量为 :","options":[["A","300ml"],["B","35Oml"],["C","450ml"],["D","500ml"],["E","550ml"]],"answer":"C","type":"A2型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"婴儿喂养方法","diff":"中","level":"本科生","id":211},{"kind":"choice","multi":false,"stem":"一胎龄 36周出生 1 个月龄儿 , 生后母乳喂养 , 出生后体重增加 1 kg , 目前应添加的是 :","options":[["A","米汤, 补充热量"],["B","鱼肝油, 补充维生素A"],["C","菜汤, 补充矿物质"],["D","鱼肝油, 补充维生素D"],["E","奶糕, 补充热量"]],"answer":"D","type":"A2型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"婴儿喂养方法","diff":"易","level":"本科生","id":212},{"kind":"choice","multi":false,"stem":"<6个月的维生素 D 缺乏性佝偻病患儿多以下列哪项骨骼改变为主 :","options":[["A","胸骨"],["B","肋骨"],["C","颅骨"],["D","四肢长骨"],["E","脊柱"]],"answer":"C","type":"A2型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"易","level":"本科生","id":213},{"kind":"choice","multi":false,"stem":"3岁女孩，体重14kg，身高85cm，食欲差，异嗜癖，面色苍白，地图舌，反复口腔溃疡，智力偏低下。该患儿可能是：","options":[["A","钙缺乏"],["B","碘缺乏"],["C","铁缺乏"],["D","铜缺乏"],["E","锌缺乏"]],"answer":"E","type":"A2型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":214},{"kind":"choice","multi":true,"stem":"隐性维生素 D 缺乏性子足抽搐症可有以下体征 :","options":[["A","Chvostek 征阳性"],["B","腓反射阳性"],["C","Trousseau 征阳性"],["D","巴宾斯基征阳性"],["E","肌阵孪"]],"answer":"ABC","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":215},{"kind":"choice","multi":true,"stem":"下列哪些是关于维生素 D 缺乏引起手足抽搐症时描述 :","options":[["A","甲状旁腺反应迅速"],["B","血磷正常或升高"],["C","血钙离子降低"],["D","碱性磷酸酶升高"],["E","早期可见多汗、易惊"]],"answer":"BCDE","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"难","level":"本科生","id":216},{"kind":"choice","multi":true,"stem":"Ⅱ型维生素 D 依赖性佝偻病的特点有：","options":[["A","常染色体隐性遗传"],["B","重症佝偻病"],["C","血清钙、磷显著降低"],["D","继发甲状旁腺功能亢进"],["E","可有高氨基酸尿症"]],"answer":"ABCD","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"难","level":"本科生","id":217},{"kind":"choice","multi":true,"stem":"对营养不良患儿的正确处理 , 有下列哪些：","options":[["A","营养不良患儿饮食选择以乳类为主"],["B","不能自行进食的患儿可鼻饲要素饮食"],["C","适当应用中药调整脾胃功能"],["D","补充各种维生素"],["E","继发感染者要应用足量的杀菌型抗生素"]],"answer":"ABCDE","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"易","level":"本科生","id":218},{"kind":"choice","multi":true,"stem":"早产儿发生佝偻病的原因主要有 :","options":[["A","钙、磷贮存少"],["B","维生素D贮存少"],["C","生长发育快,需维生素D相对较多"],["D","胃肠对维生素D及钙磷的吸收不良"],["E","部分早产儿因呼吸障碍易致低钙血症"]],"answer":"ABCE","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":219},{"kind":"choice","multi":true,"stem":"脂溶性维生素的共同特点是 :","options":[["A","主要为复合分子及细胞膜的结构, 为高度分化组织的发育所必需"],["B","多余部分可迅速从尿中排泄"],["C","易溶于脂肪和脂肪溶剂中, 故可储存在体内，不需每天供应"],["D","缺乏时症状出现较迟, 但过量易致中毒"],["E","分子特异性不高, 均有前体"]],"answer":"ACDE","type":"X型题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"儿童营养基础","diff":"中","level":"本科生","id":220},{"kind":"text","stem":"膳食评价:","answerText":"将膳食调查结果与膳食营养素参考摄入量（DRIs进行比较，评价的内容包括营养素摄入、宏量营养素的供能比和膳食能量分布等","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"营养状况评价的原则","diff":"中","level":"本科生","id":221},{"kind":"text","stem":"生长迟缓：","answerText":"是指身长（身高）低于本民族、本地区、健康的同性别、同年龄儿童的平均身长（身高）减两个标准差（-2SD）或第三百分位以下者。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"易","level":"本科生","id":222},{"kind":"text","stem":"基础代谢率：","answerText":"是指在每单位时间每平方米体表面积人体基础代谢所需的能量。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"儿童营养基础","diff":"中","level":"本科生","id":223},{"kind":"text","stem":"食物特殊动力作用：","answerText":"指摄入和吸收利用食物,可使机体的代谢增加超过基础代谢率，食物的这种作用称为食物特殊动力作用。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"儿童营养基础","diff":"易","level":"本科生","id":224},{"kind":"text","stem":"先天性佝偻病：","answerText":"指母亲患严重软骨病,或孕妇食物中维生素 D 明显不足,导致母亲体内维生素D极度缺乏,于新生儿期即可见典型症状 : 前囱甚大,骨缝增宽与后囱相连,后囱未闭,鸡胸、漏斗胸等佝偻病体征，常伴低钙惊厥, 称先天性何倭病。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":225},{"kind":"text","stem":"初乳：","answerText":"一般指产后 5-7 天内的乳汁 , 质略稠而带黄色 , 含脂肪较少而球蛋白较多 , 微量元 素、锌、白细胞、 SIgA 等免疫物质及生长因子、牛磺酸等都比较多 , 对新生儿生长发育和抗感染十分重要。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"婴儿喂养方法","diff":"中","level":"本科生","id":226},{"kind":"text","stem":"蛋白质一热能营养不良","answerText":"是由于缺乏能量和 ( 或 ) 蛋白质所致的一种营养缺乏症 , 主要见于<3岁婴幼儿 ; 除体重明显减轻、皮下脂肪减少和皮下水肿以外 , 常伴有各种器官的功能紊乱。临床上分为 : 以能量供应不足为主的称为消瘦型；以蛋白质供应不足为主的称为浮肿型；介于两者之间 的称为消瘦 -浮肿型。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"易","level":"本科生","id":227},{"kind":"text","stem":"单纯性肥胖：","answerText":"是由于长期能量摄入超过人体的消耗，使体内脂肪过度聚集、体重超过一定范围的一种营养障碍性疾病。体重超过同性别、同身高参照人群均值的20%即为肥胖。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"中","level":"本科生","id":228},{"kind":"text","stem":"消瘦：","answerText":"体重低于同年龄、同身高参照人群值 的均数减 2 个标准差 , 即属中重度体重低下。 其中高于或等于均数减 2个标准差者为中 度 , 低于均数减 3 个标准差者为重度。此指标主要反映患儿近期或急性营养不良。","type":"名词解释","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"易","level":"本科生","id":229},{"kind":"text","stem":"维生素D缺乏性佝偻病的发病机理：","answerText":"维生素D长期缺乏，血中钙、磷水平下降，甲状旁腺功能继发亢进，分泌甲状旁腺激素增加，此时旧骨的骨质吸收、溶解、释放钙迅速，使血清钙维持在正常或接近正常水平；但甲状旁腺激素抑制肾小管对磷的重吸收、大量的磷经肾排出，血磷进一步降低，钙磷乘积也下降，由于骨盐不能有效沉积，致使骨样组织的钙化发生障碍，成骨细胞代偿增生，造成骨样组织堆积、骺端增厚，向两侧膨出，AKP分泌增多，形成临床常见的“肋骨串珠”、手、脚镯、方颅等；扁骨和长骨骨膜下的骨质矿化不全，骨皮质被骨样组织代替，骨膜增厚、骨质疏松，受肌肉牵拉和重力影响而容易弯曲变形，产生一系列骨骼变形和血生化改变。血磷减少使代谢缓慢，致中间代谢产物堆积，造成代谢性酸中毒，后者有加重代谢紊乱，刺激甲状旁腺分泌PTH，形成恶性循环。","type":"简答题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"维生素营养障碍","diff":"中","level":"本科生","id":230},{"kind":"text","stem":"重度营养不良的临床特点","answerText":"体重比正常减轻 40% 以上，按年龄的体重或按身高的体重低于同年龄同性别的平均值减3个标准差， 皮下脂肪完全消失 , 面颊部脂肪亦消失 , 如皮包骨 , 呈老人样 ; 身长明显低于正常 ; 皮 肤苍白、干皱、弹性消失 ; 肌肉萎缩 , 肌张力低下 , 运动发育迟缓 ; 呆痴 , 反应低下 , 烦躁与抑制交替 ; 其他如低体 温 , 心率缓慢 , 低蛋白性水肿等。","type":"简答题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"蛋白质能量营养障碍","diff":"中","level":"本科生","id":231},{"kind":"text","stem":"简述配方奶粉量的估计：","answerText":"婴儿每千克体重每天需要热量为100千卡，此儿每天需要总能量为7×100千卡=700千卡，每100ml配方奶含热量67千卡，每天需要奶量=(700÷67)×100≈1000ml（1045 ml）；每千克每天需水分为150ml，每天总需水量1050ml； 因此，进食1000ml奶量即满足了能量的需要又满足了液体量的需要。","type":"简答题","topic1":"儿科学","topic2":"营养和营养障碍性疾病","topic3":"婴儿喂养方法","diff":"难","level":"本科生","id":232},{"kind":"choice","multi":false,"stem":"溶血尿毒综合征主要的临床特点为","options":[["A","血尿、血小板减少、急性肾衰"],["B","血尿、高血压、急性肾衰"],["C","溶血性贫血、高血压、急性肾衰"],["D","溶血性贫血、血小板减少、急性肾衰"],["E","溶血性贫血、高血压、蛋白尿"]],"answer":"D","type":"A1型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"溶血尿毒综合征","diff":"易","level":"本科生","id":233},{"kind":"choice","multi":false,"stem":"溶血尿毒综合征最常见于何年龄的儿童","options":[["A","5~10岁"],["B","<2岁"],["C","3~4岁"],["D","4~6岁"],["E","10~14岁"]],"answer":"B","type":"A1型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"溶血尿毒综合征","diff":"易","level":"本科生","id":234},{"kind":"choice","multi":false,"stem":"患儿，男，9岁，因突发面色苍白伴少尿1天就诊，拟诊溶血尿毒综合征，该患儿的下列实验室检查结果中，错误的是","options":[["A","血红蛋白明显下降"],["B","血小板显著下降"],["C","血涂片检出破碎红细胞"],["D","血肌酐升高"],["E","网织细胞减少"]],"answer":"E","type":"A2型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"溶血尿毒综合征","diff":"中","level":"本科生","id":235},{"kind":"choice","multi":false,"stem":"患儿，男，2岁，因突发面色苍白伴少尿2天，查体血压108/82mmHg，贫血貌，皮肤瘀斑，心前区Ⅱ级收缩期吹风样杂音，辅检血WBC 18.2×10＾9/L，Hb50g/L，PLT 35×10＾9/L，网织红细胞4.8%；尿常规示RBC4~5/HP、蛋白++；BUN15mmol/L，肌酐85μmol/L，该患儿最可能的诊断为","options":[["A","慢性肾炎急性发作"],["B","急进性肾炎"],["C","特发征血小板减少性紫癜"],["D","溶血尿毒综合征"],["E","先天性心脏病"]],"answer":"D","type":"A2型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"溶血尿毒综合征","diff":"中","level":"本科生","id":236},{"kind":"choice","multi":true,"stem":"溶血尿毒综合征的主要临床特征包括","options":[["A","微血管损害性溶血性贫血"],["B","急性肾功能不全"],["C","血小板减少"],["D","大量蛋白尿和血尿"],["E","高脂血症"]],"answer":"ABC","type":"X型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"溶血尿毒综合征","diff":"中","level":"本科生","id":237},{"kind":"choice","multi":true,"stem":"有关溶血尿毒综合征不正确的是","options":[["A","多见于学龄期，婴幼儿少见"],["B","绝大多数与产生螺旋毒素的细菌有关"],["C","前驱感染多为呼吸道感染"],["D","所有患儿均有血小板减少"],["E","为血管内皮损伤引发级联反应，进 3":"血尿","diff":"易","level":"本科生","id":259},{"kind":"text","stem":"镜下血尿","answerText":"离心尿 RBC>3个/HP, 或不离心原RBC>1~2 个/HP 。","type":"名词解释","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"易","level":"本科生","id":260},{"kind":"text","stem":"单纯性血尿","answerText":"以血尿为主要表现而无明显临床症状,其他化验和肾功能均正常的病例。","type":"名词解释","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"易","level":"本科生","id":261},{"kind":"text","stem":"试述如何鉴别肾小球性和非肾小球性血尿。","answerText":"①尿沉渣红细胞形态学检查：若以异形红细胞为主（>30%）则提示为肾小球性血尿，以均一形为主则提示非肾小球性；②尿中红细胞平均体积测定：若MCV<72fl且呈小细胞分布，提示肾小球性；③尿沉渣检查见到红细胞管型和肾小管上皮细胞，提示肾小球性，若镜下血尿时，尿蛋白定量>500mg/24h,肉眼血尿时尿蛋白>990mg/24h，或>660mg/L，提示肾小球性；④尿红细胞电泳：肾小球性者为20.64±1.72秒，非肾小球性者27.27±1.66秒。","type":"简答题","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"中","level":"本科生","id":262},{"kind":"text","stem":"试述血尿的病因。","answerText":"①肾小球性血尿：原发性或继发性肾小球肾炎、Aiport综合征、家族性复发性血尿、单纯性血尿、lgA肾病；②非肾小球性血尿：泌尿系畸形、泌尿系肿瘤、高钙尿症、胡桃夹现象、肾结石、肾外伤等；③其他原因所致血尿：药物性、肾毒性、过敏性、机械性","type":"简答题","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"易","level":"本科生","id":263},{"kind":"choice","multi":false,"stem":"(1～3题共用题干)患儿男，8岁，尿红1次来诊，无发热，查体无浮肿，无少尿，血压108/70mmHg，辅检尿常规示红细胞 3+/HP，隐血3+，蛋白++，泌尿系B超未提示异常，\n\n为进一步明确诊断，首先考虑行下列何种检查为宜：B中等","options":[["A","肾功能"],["B","左肾静脉B超"],["C","ASO及补体"],["D","静脉肾盂造影"],["E","尿液相差显微镜检查 若该患儿肉眼血尿反复发作，其父母尿检正常，最可能的肾小球疾病是：D中等 A.急性链球菌感染后肾小球肾炎 B.肾炎性肾病 C.Alport综合征 D.IgA肾病 E.乙肝病毒相关性肾炎"]],"answer":"B","subNo":1,"type":"仿真题","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"","level":"本科生","id":264},{"kind":"choice","multi":false,"stem":"(1～3题共用题干)患儿男，8岁，尿红1次来诊，无发热，查体无浮肿，无少尿，血压108/70mmHg，辅检尿常规示红细胞 3+/HP，隐血3+，蛋白++，泌尿系B超未提示异常，\n\n若该患儿尿液PH值呈碱性，则该患儿发生肉眼血尿的尿色最可能为：A容易","options":[["A","洗肉水样"],["B","浓茶色"],["C","酱油色"],["D","黄色"],["E","烟灰水样"]],"answer":"D","subNo":2,"type":"仿真题","topic1":"儿科学","topic2":"泌尿系统","topic3":"血尿","diff":"","level":"本科生","id":265},{"kind":"choice","multi":false,"stem":"小儿泌尿道感染，中段尿培养菌落计数，有确诊意义的是","options":[["A","菌落计数>10＾3/ml"],["B","菌落计数>10＾4/ml"],["C","杆菌菌落计数>10＾4/ml~10＾5/ml之间"],["D","球菌落计数>10＾2 者应卧床休息 1~2周，待水肿消退、肉眼血尿消失、血压正常即可下床活动；尿常规好转，仅能检出少量蛋白和红细胞时可以复学；尿常规正常3个月可恢复体力活动。尿少、水肿期应限制纳盐摄入，氮质血症期应控制饮食蛋白摄入量。","type":"简答题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"中","level":"本科生","id":339},{"kind":"text","stem":"简述急性肾炎高血压脑病的治疗措施。","answerText":"①止惊；②降压:可选用硝普纳或二氮嚓降压；③脱水: 可静脉注射高张葡萄糖等,或用呋噻米注射利尿。","type":"简答题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"易","level":"本科生","id":340},{"kind":"text","stem":"简述急性链球菌感染后肾炎严重循环充血的处理。","answerText":"①严格限制水盐入量；②强利尿剂促进液体排出；③硝普纳扩张血管减轻前后负荷；④必要时腹膜或血液透析；⑤适当使用快速强心药, 但剂量宜小","type":"简答题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"中","level":"本科生","id":341},{"kind":"choice","multi":false,"stem":"(1～3题共用备选答案)患儿，男，10岁，2周前有咽痛、发热史，近5天出现进行性少尿、水肿，今日起出现头痛、视物模糊。查体：体温37.3℃，血压160/110mmHg，双眼睑、面部水肿，心率101次/分，律齐，两肺未及罗音、腹部无异常，双下肢中度非凹陷性水肿，辅检尿常规：白细胞+/HP，红细胞+++/HP，蛋白（+）\n\n该患儿最可能的诊断是  容易","options":[["A","肾炎性肾病"],["B","急进性肾炎"],["C","泌尿系感染"],["D","急性肾小球肾炎并严重循环充血"],["E","急性肾小球肾炎合并高血压脑病"]],"answer":"A","subNo":1,"type":"仿真题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"","level":"本科生","id":342},{"kind":"choice","multi":false,"stem":"(1～3题共用备选答案)患儿，男，10岁，2周前有咽痛、发热史，近5天出现进行性少尿、水肿，今日起出现头痛、视物模糊。查体：体温37.3℃，血压160/110mmHg，双眼睑、面部水肿，心率101次/分，律齐，两肺未及罗音、腹部无异常，双下肢中度非凹陷性水肿，辅检尿常规：白细胞+/HP，红细胞+++/HP，蛋白（+）\n\n对该患儿的紧急处理原则为  中等","options":[["A","控制感染，利尿，镇静"],["B","镇静，降压，利尿"],["C","利尿，镇静"],["D","降颅压，镇静"],["E","卧床休息，限制水、钠摄入"]],"answer":"B","subNo":2,"type":"仿真题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"","level":"本科生","id":343},{"kind":"choice","multi":false,"stem":"(1～3题共用备选答案)患儿，男，10岁，2周前有咽痛、发热史，近5天出现进行性少尿、水肿，今日起出现头痛、视物模糊。查体：体温37.3℃，血压160/110mmHg，双眼睑、面部水肿，心率101次/分，律齐，两肺未及罗音、腹部无异常，双下肢中度非凹陷性水肿，辅检尿常规：白细胞+/HP，红细胞+++/HP，蛋白（+）\n\n下列哪项处理不正确  中等","options":[["A","低盐饮食"],["B","卧床休息"],["C","硝普钠降压"],["D","苯巴比妥钠镇静"],["E","西地兰强心"]],"answer":"E","subNo":3,"type":"仿真题","topic1":"儿科学","topic2":"泌尿系统","topic3":"急性肾小球肾炎","diff":"","level":"本科生","id":344},{"kind":"choice","multi":false,"stem":"下列哪项不是急性肾功能衰竭的临床表现","options" ,["D","肾炎性肾病"],["E","急性肾衰竭"]],"answer":"C","type":"A1型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"肾病综合征","diff":"易","level":"本科生","id":386},{"kind":"choice","multi":false,"stem":"4岁患儿，临床诊断为单纯性肾病综合征，口服泼尼松30mg/天，共3周，尿蛋白转阴，进一步治疗措施是","options":[["A","停用泼尼松"],["B","泼尼松30mg隔日顿服"],["C","继续泼尼松30mg/天，4周"],["D","继续泼尼松30mg/天，1周"],["E","继续泼尼松30mg/天，5周"]],"answer":"D","type":"A1型题","topic1":"儿科学","topic2":"泌尿系统","topic3":"肾病综合征","diff":"易","level":"本科生","id":387}]</script>
<script>
(function () {
  'use strict';

  var QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
  var LS_KEY = 'peds_quiz_v1';

  var S = {
    pool: [], idx: 0, mode: 'order',
    records: {}, fav: [], wrong: [],
    pending: [], started: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uniq(a) {
    var out = [], seen = {};
    a.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  /* ---------------- 本地存储 ---------------- */
  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      S.records = o.records || {};
      S.fav = o.fav || [];
      S.wrong = o.wrong || [];
      S.mode = o.mode || 'order';
    } catch (e) { /* ignore */ }
  }
  function saveState() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        records: S.records, fav: S.fav, wrong: S.wrong, mode: S.mode
      }));
    } catch (e) { /* ignore */ }
  }

  /* ---------------- 初始化下拉框 ---------------- */
  function fillSelect(el, list) {
    el.innerHTML = '<option value="">全部</option>' +
      list.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  }

  function boot() {
    loadState();
    fillSelect($('fType'), uniq(QUESTIONS.map(function (q) { return q.type; })));
    fillSelect($('fTopic'), uniq(QUESTIONS.map(function (q) { return q.topic2; })));
    fillSelect($('fDiff'), uniq(QUESTIONS.map(function (q) { return q.diff; })));
    fillSelect($('fLevel'), uniq(QUESTIONS.map(function (q) { return q.level; })));
    $('mode').value = S.mode;

    $('startBtn').onclick = start;
    $('resetBtn').onclick = resetAll;
    $('panelBtn').onclick = function () {
      $('panel').classList.toggle('hidden');
    };
    $('prevBtn').onclick = function () { go(-1); };
    $('nextBtn').onclick = function () { go(1); };
    $('revealBtn').onclick = reveal;
    $('submitBtn').onclick = function () { submitCur(S.pending.slice()); };
    $('favBtn').onclick = toggleFav;

    document.addEventListener('keydown', function (e) {
      if ($('quiz').classList.contains('hidden')) return;
      var q = S.pool[S.idx];
      if (!q) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') { go(-1); }
      else if (e.key === 'ArrowRight') { go(1); }
      else if (/^[a-eA-E]$/.test(e.key) && q.kind === 'choice') {
        var k = e.key.toUpperCase();
        if (S.records[q.id]) return;
        if (q.options.some(function (o) { return o[0] === k; })) {
          e.preventDefault();
          onPick(q, k);
        }
      }
    });

    updateStats();
  }

  /* ---------------- 组卷 ---------------- */
  function buildPool() {
    var fType = $('fType').value, fTopic = $('fTopic').value;
    var fDiff = $('fDiff').value, fLevel = $('fLevel').value;

    var arr = QUESTIONS.filter(function (q) {
      if (fType && q.type !== fType) return false;
      if (fTopic && q.topic2 !== fTopic) return false;
      if (fDiff && q.diff !== fDiff) return false;
      if (fLevel && q.level !== fLevel) return false;
      return true;
    });

    if (S.mode === 'wrong') {
      arr = arr.filter(function (q) { return S.wrong.indexOf(q.id) >= 0; });
    } else if (S.mode === 'fav') {
      arr = arr.filter(function (q) { return S.fav.indexOf(q.id) >= 0; });
    }

    if (S.mode === 'random') {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
    return arr;
  }

  function start() {
    S.mode = $('mode').value;
    saveState();

    var pool = buildPool();
    if (!pool.length) {
      alert(S.mode === 'wrong' ? '错题本是空的，先去练习吧~'
        : S.mode === 'fav' ? '收藏夹是空的哦~'
        : '当前筛选条件下没有题目，请调整筛选条件。');
      return;
    }
    S.pool = pool;
    S.idx = 0;
    S.started = true;
    S.pending = [];

    $('quiz').classList.remove('hidden');
    $('sheetPanel').classList.remove('hidden');
    $('panel').classList.add('hidden');
    $('submitBtn').classList.add('hidden');

    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetAll() {
    if (!confirm('确定要清空所有答题记录、错题和收藏吗？此操作不可恢复。')) return;
    S.records = {}; S.fav = []; S.wrong = [];
    saveState();
    updateStats();
    if (S.started) render();
  }

  /* ---------------- 渲染 ---------------- */
  function cur() { return S.pool[S.idx]; }

  function render() {
    var q = cur();
    if (!q) return;

    var rec = S.records[q.id] || null;
    var answered = !!rec;

    $('qIndex').textContent = (S.idx + 1) + ' / ' + S.pool.length;
    $('qType').textContent = q.type + (q.subNo ? ' (第' + q.subNo + '小题)' : '');

    var dEl = $('qDiff');
    if (q.diff) {
      dEl.textContent = '难度 ' + q.diff;
      dEl.className = 'pill diff-' + q.diff;
      dEl.style.display = '';
    } else {
      dEl.style.display = 'none';
    }

    $('qTopic').textContent = [q.topic2, q.topic3].filter(Boolean).join(' · ');

    $('stem').textContent = q.stem || '（无题干）';

    var box = $('options');
    var fb = $('feedback');
    box.innerHTML = '';
    fb.className = 'feedback';
    fb.textContent = '';

    var fav = S.fav.indexOf(q.id) >= 0;
    $('favBtn').textContent = fav ? '★ 已收藏' : '☆ 收藏';

    $('revealBtn').classList.toggle('hidden', q.kind !== 'text' && answered);
    $('submitBtn').classList.add('hidden');

    if (q.kind === 'choice') {
      var chosen = (rec && rec.sel) ? rec.sel : [];
      var rightKeys = q.answer.split('');

      q.options.forEach(function (pair) {
        var k = pair[0], t = pair[1];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.dataset.k = k;

        var kk = document.createElement('span');
        kk.className = 'k'; kk.textContent = k;
        var tt = document.createElement('span');
        tt.className = 't'; tt.textContent = t;

        b.appendChild(kk); b.appendChild(tt);

        if (chosen.indexOf(k) >= 0) b.classList.add('sel');

        if (answered) {
          b.disabled = true;
          if (rightKeys.indexOf(k) >= 0) b.classList.add('ok');
          else if (chosen.indexOf(k) >= 0) b.classList.add('bad');
        } else {
          b.onclick = function () { onPick(q, k); };
        }
        box.appendChild(b);
      });

      if (answered) {
        showFeedback(q, rec);
      } else if (q.multi) {
        S.pending = [];
        $('submitBtn').classList.remove('hidden');
        $('submitBtn').disabled = true;
      }

    } else {
      // 名词解释 / 简答题
      if (answered) {
        showFeedback(q, rec);
        $('revealBtn').classList.add('hidden');
      }
    }

    $('prevBtn').disabled = (S.idx === 0);
    $('nextBtn').disabled = (S.idx >= S.pool.length - 1);
    $('bar').style.width = (((S.idx + 1) / S.pool.length) * 100).toFixed(2) + '%';

    renderSheet();
  }

  function showFeedback(q, rec) {
    var fb = $('feedback');
    if (q.kind === 'text') {
      fb.className = 'feedback info show';
      fb.textContent = q.answerText || '（无答案）';
      return;
    }
    if (rec.ok === true) {
      fb.className = 'feedback ok show';
      fb.textContent = '✓ 回答正确　　正确答案：' + q.answer;
    } else if (rec.ok === false) {
      fb.className = 'feedback bad show';
      fb.textContent = '✗ 回答错误　　正确答案：' + q.answer +
        (rec.sel && rec.sel.length ? '　　你的选择：' + rec.sel.join('') : '');
    } else {
      fb.className = 'feedback info show';
      fb.textContent = '正确答案：' + q.answer;
    }
  }

  /* ---------------- 作答 ---------------- */
  function onPick(q, k) {
    if (S.records[q.id]) return;

    if (q.multi) {
      var i = S.pending.indexOf(k);
      if (i >= 0) S.pending.splice(i, 1);
      else S.pending.push(k);

      Array.prototype.forEach.call(document.querySelectorAll('#options .opt'), function (el) {
        el.classList.toggle('sel', S.pending.indexOf(el.dataset.k) >= 0);
      });
      $('submitBtn').disabled = S.pending.length === 0;
    } else {
      submitCur([k]);
    }
  }

  function submitCur(sel) {
    var q = cur();
    if (!q || q.kind !== 'choice' || S.records[q.id]) return;

    var right = q.answer.split('').sort().join('');
    var mine = sel.slice().sort().join('');
    var ok = (right === mine);

    S.records[q.id] = { sel: sel.slice(), ok: ok };

    var wi = S.wrong.indexOf(q.id);
    if (!ok) {
      if (wi < 0) S.wrong.push(q.id);
    } else if (wi >= 0) {
      S.wrong.splice(wi, 1);
    }

    saveState();
    S.pending = [];
    render();
    updateStats();
  }

  function reveal() {
    var q = cur();
    if (!q) return;
    if (q.kind === 'text') {
      if (!S.records[q.id]) {
        S.records[q.id] = { seen: true, ok: null };
        saveState();
        updateStats();
      }
      render();
    } else {
      // 选择题：仅查看答案（不计入正确率，但记入错题本便于复习）
      if (!S.records[q.id]) {
        S.records[q.id] = { sel: [], ok: false };
        if (S.wrong.indexOf(q.id) < 0) S.wrong.push(q.id);
        saveState();
        updateStats();
      }
      render();
    }
  }

  function toggleFav() {
    var q = cur();
    if (!q) return;
    var i = S.fav.indexOf(q.id);
    if (i >= 0) S.fav.splice(i, 1);
    else S.fav.push(q.id);
    saveState();
    $('favBtn').textContent = i >= 0 ? '☆ 收藏' : '★ 已收藏';
  }

  function go(step) {
    var n = S.idx + step;
    if (n < 0 || n >= S.pool.length) return;
    S.idx = n;
    S.pending = [];
    render();
  }

  /* ---------------- 答题卡 & 统计 ---------------- */
  function renderSheet() {
    var el = $('sheet');
    el.innerHTML = '';
    S.pool.forEach(function (q, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(i + 1);
      var r = S.records[q.id];
      if (r) {
        if (r.ok === true) b.classList.add('ok');
        else if (r.ok === false) b.classList.add('bad');
        else b.classList.add('seen');
      }
      if (i === S.idx) b.classList.add('cur');
      b.onclick = function () { S.idx = i; S.pending = []; render(); };
      el.appendChild(b);
    });
    var done = S.pool.filter(function (q) { return !!S.records[q.id]; }).length;
    $('sheetInfo').textContent = '本组 ' + S.pool.length + ' 题，已做 ' + done + ' 题';
  }

  function updateStats() {
    var total = QUESTIONS.length, answered = 0, right = 0, wrong = 0;
    for (var k in S.records) {
      if (!Object.prototype.hasOwnProperty.call(S.records, k)) continue;
      var r = S.records[k];
      if (r.ok === true) { answered++; right++; }
      else if (r.ok === false) { answered++; wrong++; }
      else if (r.seen) answered++;
    }
    var rate = (right + wrong) ? Math.round(right * 100 / (right + wrong)) : 0;
    $('stats').innerHTML =
      '<span>题库 <b>' + total + '</b> 题</span>' +
      '<span>已做 <b>' + answered + '</b></span>' +
      '<span>正确率 <b>' + rate + '%</b></span>' +
      '<span>错题 <b>' + S.wrong.length + '</b></span>';
  }

  boot();
})();
</script>
</body>
</html>
